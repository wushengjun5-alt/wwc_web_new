<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialiser le mot de passe - Wallah We Can</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --wwc-primary: #1e3a5f; --wwc-secondary: #ff6b35;
            --wwc-text: #2c3e50; --wwc-text-light: #6c757d;
            --wwc-bg: #ffffff; --wwc-bg-light: #f8f9fa;
            --wwc-border: #dee2e6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; color: var(--wwc-text); background: var(--wwc-bg-light); }
        .header { background: var(--wwc-primary); padding: 15px 20px; }
        .logo { font-size: 22px; font-weight: 700; color: white; text-decoration: none; }
        .main { max-width: 440px; margin: 60px auto; padding: 0 20px; }
        .card { background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 32px; }
        h2 { color: var(--wwc-primary); margin-bottom: 8px; }
        p.desc { color: var(--wwc-text-light); font-size: 14px; margin-bottom: 24px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; }
        .form-group input { width: 100%; padding: 12px 14px; border: 1px solid var(--wwc-border); border-radius: 8px; font-size: 15px; font-family: inherit; }
        .form-group input:focus { outline: none; border-color: var(--wwc-primary); box-shadow: 0 0 0 3px rgba(30,58,95,0.08); }
        .btn { width: 100%; padding: 14px; background: var(--wwc-secondary); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .btn:hover { background: #e55a2b; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 18px; font-size: 14px; display: none; }
        .alert-success { background: #d4edda; color: #155724; }
        .alert-error   { background: #f8d7da; color: #721c24; }
        .invalid { text-align: center; padding: 40px 0; }
        .invalid a { color: var(--wwc-secondary); font-weight: 600; }
    </style>
</head>
<body>
    <header class="header">
        <a href="/shop/" class="logo">WALLAH WE CAN</a>
    </header>
    <main class="main">
        <div class="card" id="card-content">
            <div class="loading" style="text-align:center;padding:40px;">Chargement…</div>
        </div>
    </main>
    <script>
        const API_URL = '/api/v1';
        const params  = new URLSearchParams(window.location.search);
        const uid     = params.get('uid');
        const token   = params.get('token');

        const card = document.getElementById('card-content');

        if (!uid || !token) {
            card.innerHTML = `
                <div class="invalid">
                    <h2>Lien invalide</h2>
                    <p style="margin:12px 0;color:#6c757d;">Ce lien est invalide ou a expiré.</p>
                    <a href="/shop/login/">Demander un nouveau lien →</a>
                </div>`;
        } else {
            card.innerHTML = `
                <h2>Nouveau mot de passe</h2>
                <p class="desc">Choisissez un mot de passe sécurisé d'au moins 8 caractères.</p>
                <div class="alert alert-error" id="err"></div>
                <div class="alert alert-success" id="ok"></div>
                <form id="form" onsubmit="submit(event)">
                    <div class="form-group">
                        <label>Nouveau mot de passe</label>
                        <input type="password" name="password" required minlength="8" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label>Confirmer</label>
                        <input type="password" name="password_confirm" required autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn" id="btn">Réinitialiser le mot de passe</button>
                </form>`;
        }

        async function submit(e) {
            e.preventDefault();
            const form = e.target;
            const pw   = form.password.value;
            const pw2  = form.password_confirm.value;
            const err  = document.getElementById('err');
            const ok   = document.getElementById('ok');
            err.style.display = 'none'; ok.style.display = 'none';

            if (pw !== pw2) { err.textContent = 'Les mots de passe ne correspondent pas.'; err.style.display = 'block'; return; }

            const btn = document.getElementById('btn');
            btn.disabled = true; btn.textContent = '…';

            try {
                const res  = await fetch(`${API_URL}/auth/password-reset/confirm/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid, token, password: pw, password_confirm: pw2 })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || data.token?.[0] || data.uid?.[0] || 'Erreur');

                ok.textContent = 'Mot de passe réinitialisé ! Redirection vers la connexion…';
                ok.style.display = 'block';
                form.style.display = 'none';
                setTimeout(() => window.location.href = '/shop/login/', 2000);
            } catch (ex) {
                err.textContent = ex.message;
                err.style.display = 'block';
                btn.disabled = false; btn.textContent = 'Réinitialiser le mot de passe';
            }
        }
    </script>
</body>
</html>
