<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Wallah We Can</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --wwc-primary: #1e3a5f;
            --wwc-secondary: #ff6b35;
            --wwc-accent: #f8b4c4;
            --wwc-text: #2c3e50;
            --wwc-text-light: #6c757d;
            --wwc-bg: #ffffff;
            --wwc-bg-light: #f8f9fa;
            --wwc-border: #dee2e6;
            --wwc-success: #28a745;
            --wwc-error: #dc3545;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; color: var(--wwc-text); background: var(--wwc-bg-light); }

        .header { background: var(--wwc-primary); padding: 15px 0; }
        .header-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-size: 24px; font-weight: 700; color: white; text-decoration: none; }
        .back-link { color: white; text-decoration: none; opacity: 0.9; }
        .back-link:hover { opacity: 1; }

        .main { max-width: 480px; margin: 60px auto; padding: 0 20px; }

        .auth-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .tab-bar {
            display: flex;
            border-bottom: 1px solid var(--wwc-border);
        }
        .tab-btn {
            flex: 1;
            padding: 16px;
            background: none;
            border: none;
            font-size: 15px;
            font-weight: 600;
            color: var(--wwc-text-light);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }
        .tab-btn.active {
            color: var(--wwc-primary);
            border-bottom-color: var(--wwc-primary);
        }

        .tab-content { padding: 30px; display: none; }
        .tab-content.active { display: block; }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px 14px;
            border: 1px solid var(--wwc-border);
            border-radius: 8px; font-size: 15px;
            font-family: inherit; transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none; border-color: var(--wwc-primary);
            box-shadow: 0 0 0 3px rgba(30,58,95,0.08);
        }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .btn-primary {
            width: 100%; padding: 14px;
            background: var(--wwc-secondary); color: white;
            border: none; border-radius: 8px;
            font-size: 16px; font-weight: 600;
            cursor: pointer; transition: background 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary:hover { background: #e55a2b; }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }

        .forgot-link { text-align: right; margin-bottom: 16px; }
        .forgot-link a { font-size: 13px; color: var(--wwc-text-light); text-decoration: none; }
        .forgot-link a:hover { color: var(--wwc-primary); }

        .switch-msg { text-align: center; margin-top: 20px; font-size: 14px; color: var(--wwc-text-light); }
        .switch-msg a { color: var(--wwc-primary); font-weight: 600; cursor: pointer; text-decoration: none; }

        .alert {
            padding: 12px 16px; border-radius: 8px;
            margin-bottom: 18px; font-size: 14px; display: none;
        }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error   { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .business-field { display: none; }

        .spinner-sm {
            width: 16px; height: 16px;
            border: 2px solid white; border-top-color: transparent;
            border-radius: 50%; animation: spin 0.8s linear infinite; display: none;
        }
        .loading .spinner-sm { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Forgot password inline section */
        .forgot-section { display: none; padding: 30px; }
        .forgot-section.active { display: block; }
        .back-to-login { background: none; border: none; color: var(--wwc-primary); font-weight: 600; cursor: pointer; margin-bottom: 20px; font-size: 14px; }

        .footer { background: var(--wwc-primary); color: white; padding: 20px 0; margin-top: 60px; text-align: center; font-size: 14px; opacity: 0.9; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <a href="/shop/" class="logo">WALLAH WE CAN</a>
            <a href="/shop/" class="back-link">← Retour à la boutique</a>
        </div>
    </header>

    <main class="main">
        <div class="auth-card">

            <!-- Tabs -->
            <div class="tab-bar" id="tab-bar">
                <button class="tab-btn active" onclick="switchTab('login')">Se connecter</button>
                <button class="tab-btn" onclick="switchTab('register')">Créer un compte</button>
            </div>

            <!-- Login Tab -->
            <div class="tab-content active" id="tab-login">
                <div class="alert alert-error" id="login-error"></div>
                <div class="alert alert-success" id="login-success"></div>

                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Adresse e-mail</label>
                        <input type="email" name="email" required autocomplete="email" placeholder="vous@exemple.com">
                    </div>
                    <div class="form-group">
                        <label>Mot de passe</label>
                        <input type="password" name="password" required autocomplete="current-password">
                    </div>
                    <div class="forgot-link">
                        <a href="#" onclick="showForgot(); return false;">Mot de passe oublié ?</a>
                    </div>
                    <button type="submit" class="btn-primary" id="login-btn">
                        <span class="spinner-sm"></span>
                        Se connecter
                    </button>
                </form>

                <p class="switch-msg">
                    Pas encore de compte ? <a onclick="switchTab('register')">Créer un compte</a>
                </p>
            </div>

            <!-- Register Tab -->
            <div class="tab-content" id="tab-register">
                <div class="alert alert-error" id="register-error"></div>
                <div class="alert alert-success" id="register-success"></div>

                <form id="register-form" onsubmit="handleRegister(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Prénom *</label>
                            <input type="text" name="first_name" required autocomplete="given-name">
                        </div>
                        <div class="form-group">
                            <label>Nom</label>
                            <input type="text" name="last_name" autocomplete="family-name">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Adresse e-mail *</label>
                        <input type="email" name="email" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label>Mot de passe *</label>
                        <input type="password" name="password" required autocomplete="new-password" minlength="8">
                    </div>
                    <div class="form-group">
                        <label>Confirmer le mot de passe *</label>
                        <input type="password" name="password_confirm" required autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label>Type de compte</label>
                        <select name="customer_type" onchange="toggleBusinessField(this)">
                            <option value="individual">Particulier</option>
                            <option value="business">Professionnel</option>
                        </select>
                    </div>
                    <div class="form-group business-field" id="company-field">
                        <label>Nom de la société</label>
                        <input type="text" name="company_name" autocomplete="organization">
                    </div>
                    <button type="submit" class="btn-primary" id="register-btn">
                        <span class="spinner-sm"></span>
                        Créer mon compte
                    </button>
                </form>

                <p class="switch-msg">
                    Déjà un compte ? <a onclick="switchTab('login')">Se connecter</a>
                </p>
            </div>

            <!-- Forgot Password Section (replaces login tab content) -->
            <div class="forgot-section" id="forgot-section">
                <button class="back-to-login" onclick="hideForgot()">← Retour à la connexion</button>
                <h3 style="margin-bottom:8px; color: var(--wwc-primary);">Mot de passe oublié</h3>
                <p style="font-size:14px; color: var(--wwc-text-light); margin-bottom:20px;">
                    Entrez votre e-mail et nous vous enverrons un lien de réinitialisation.
                </p>
                <div class="alert alert-error" id="forgot-error"></div>
                <div class="alert alert-success" id="forgot-success"></div>
                <form id="forgot-form" onsubmit="handleForgot(event)">
                    <div class="form-group">
                        <label>Adresse e-mail</label>
                        <input type="email" name="email" required placeholder="vous@exemple.com">
                    </div>
                    <button type="submit" class="btn-primary" id="forgot-btn">
                        <span class="spinner-sm"></span>
                        Envoyer le lien
                    </button>
                </form>
            </div>

        </div>
    </main>

    <footer class="footer">© 2026 Wallah We Can</footer>

    <script>
        const API_URL = 'http://127.0.0.1:8000/api/v1';

        // Check if already logged in
        function getToken() { return localStorage.getItem('wwc_access_token'); }
        function setTokens(access, refresh) {
            localStorage.setItem('wwc_access_token', access);
            if (refresh) localStorage.setItem('wwc_refresh_token', refresh);
        }
        function clearTokens() {
            localStorage.removeItem('wwc_access_token');
            localStorage.removeItem('wwc_refresh_token');
        }

        if (getToken()) {
            const redirect = new URLSearchParams(window.location.search).get('redirect') || '/shop/account/';
            window.location.href = redirect;
        }

        // Check if we should open register tab
        if (new URLSearchParams(window.location.search).get('tab') === 'register') {
            switchTab('register');
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach((b, i) => {
                b.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
            });
            document.getElementById('tab-login').classList.toggle('active', tab === 'login');
            document.getElementById('tab-register').classList.toggle('active', tab === 'register');
            document.getElementById('forgot-section').classList.remove('active');
            document.getElementById('tab-bar').style.display = 'flex';
        }

        function showForgot() {
            document.getElementById('tab-bar').style.display = 'none';
            document.getElementById('tab-login').classList.remove('active');
            document.getElementById('tab-register').classList.remove('active');
            document.getElementById('forgot-section').classList.add('active');
        }

        function hideForgot() {
            document.getElementById('tab-bar').style.display = 'flex';
            document.getElementById('forgot-section').classList.remove('active');
            document.getElementById('tab-login').classList.add('active');
        }

        function toggleBusinessField(sel) {
            document.getElementById('company-field').style.display =
                sel.value === 'business' ? 'block' : 'none';
        }

        function showAlert(id, msg, type) {
            const el = document.getElementById(id);
            el.className = `alert alert-${type}`;
            el.textContent = msg;
            el.style.display = 'block';
        }

        function setLoading(btnId, loading) {
            const btn = document.getElementById(btnId);
            btn.disabled = loading;
            btn.querySelector('.spinner-sm').style.display = loading ? 'inline-block' : 'none';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const form = e.target;
            document.getElementById('login-error').style.display = 'none';
            document.getElementById('login-success').style.display = 'none';
            setLoading('login-btn', true);

            try {
                const res = await fetch(`${API_URL}/auth/login/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        email: form.email.value,
                        password: form.password.value,
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || data.detail || 'Erreur de connexion');

                if (data.access) setTokens(data.access, data.refresh);
                showAlert('login-success', 'Connexion réussie ! Redirection…', 'success');

                setTimeout(() => {
                    const redirect = new URLSearchParams(window.location.search).get('redirect') || '/shop/account/';
                    window.location.href = redirect;
                }, 800);
            } catch (err) {
                showAlert('login-error', err.message, 'error');
                setLoading('login-btn', false);
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const form = e.target;
            const data = Object.fromEntries(new FormData(form));
            document.getElementById('register-error').style.display = 'none';
            document.getElementById('register-success').style.display = 'none';

            if (data.password !== data.password_confirm) {
                showAlert('register-error', 'Les mots de passe ne correspondent pas.', 'error');
                return;
            }
            setLoading('register-btn', true);

            try {
                const res = await fetch(`${API_URL}/auth/register/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(data)
                });
                const json = await res.json();
                if (!res.ok) {
                    const msg = json.error || json.email?.[0] || json.password?.[0] || 'Erreur lors de l\'inscription';
                    throw new Error(msg);
                }

                if (json.access) setTokens(json.access, json.refresh);
                showAlert('register-success', 'Compte créé ! Redirection…', 'success');

                setTimeout(() => {
                    window.location.href = '/shop/account/';
                }, 800);
            } catch (err) {
                showAlert('register-error', err.message, 'error');
                setLoading('register-btn', false);
            }
        }

        async function handleForgot(e) {
            e.preventDefault();
            const form = e.target;
            document.getElementById('forgot-error').style.display = 'none';
            document.getElementById('forgot-success').style.display = 'none';
            setLoading('forgot-btn', true);

            try {
                const res = await fetch(`${API_URL}/auth/password-reset/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: form.email.value })
                });
                const data = await res.json();
                showAlert('forgot-success', data.message || 'Si cet email existe, un lien a été envoyé.', 'success');
                form.reset();
            } catch (err) {
                showAlert('forgot-error', err.message, 'error');
            } finally {
                setLoading('forgot-btn', false);
            }
        }
    </script>
</body>
</html>
