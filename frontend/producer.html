<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producteur - Wallah We Can</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --wwc-primary: #e04403;
            --wwc-secondary: #1c345e;
            --wwc-dark: #191919;
            --wwc-text: #404040;
            --wwc-text-light: #888888;
            --wwc-bg: #ffffff;
            --wwc-bg-light: #f5f5f5;
            --wwc-border: #ececec;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans', sans-serif; font-size: 15px; color: var(--wwc-text); background: var(--wwc-bg-light); line-height: 1.7em; }

        /* Header */
        .header { background: #1c345e; height: 70px; position: sticky; top: 0; z-index: 200; }
        .header-container { max-width: 1200px; margin: 0 auto; padding: 0 24px; height: 70px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
        .logo { display: flex; align-items: center; gap: 6px; text-decoration: none; flex-shrink: 0; }
        .logo img { max-width: 120px; height: auto; display: block; }
        .logo-text { font-family: 'Montserrat', sans-serif; font-size: 16px; font-weight: 800; color: white; letter-spacing: 0.5px; line-height: 1.1; text-transform: uppercase; }
        .nav { display: flex; gap: 28px; align-items: center; }
        .nav a { color: rgba(255,255,255,0.85); text-decoration: none; font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.3px; transition: color 0.2s; white-space: nowrap; }
        .nav a:hover { color: var(--wwc-primary); }
        .header-actions { display: flex; gap: 15px; align-items: center; }
        .hdr-dropdown { position: relative; }
        .hdr-dropdown-btn { display: flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); color: white; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .hdr-dropdown-btn:hover { background: rgba(255,255,255,0.22); }
        .hdr-dropdown-menu { display: none; position: absolute; top: calc(100% + 6px); right: 0; background: white; border: 1px solid #ececec; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); overflow: hidden; min-width: 100%; z-index: 300; }
        .hdr-dropdown-menu.open { display: block; }
        .hdr-dropdown-item { display: block; width: 100%; padding: 9px 16px; background: none; border: none; text-align: left; font-size: 13px; font-weight: 600; color: #404040; cursor: pointer; white-space: nowrap; transition: background 0.15s, color 0.15s; }
        .hdr-dropdown-item:hover { background: #f5f5f5; color: #e04403; }
        .hdr-dropdown-item.active { color: #e04403; background: rgba(224,68,3,0.07); }

        /* Hero banner */
        .producer-hero {
            background: linear-gradient(135deg, var(--wwc-secondary) 0%, #0d2040 100%);
            color: white;
            padding: 60px 20px;
        }
        .producer-hero-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            gap: 40px;
            align-items: center;
        }
        .producer-photo {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255,255,255,0.3);
            flex-shrink: 0;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            overflow: hidden;
        }
        .producer-photo img { width: 100%; height: 100%; object-fit: cover; }
        .producer-hero-info h1 { font-family: 'Montserrat', sans-serif; font-size: 32px; font-weight: 800; margin-bottom: 8px; }
        .producer-location { font-size: 16px; opacity: 0.8; margin-bottom: 16px; }
        .producer-stats { display: flex; gap: 32px; margin-top: 20px; }
        .producer-stat { text-align: center; }
        .producer-stat-num { font-family: 'Montserrat', sans-serif; font-size: 28px; font-weight: 800; }
        .producer-stat-label { font-size: 12px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Main content */
        .main { max-width: 900px; margin: 0 auto; padding: 40px 20px; }

        .section-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--wwc-secondary);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--wwc-border);
        }

        .bio-text {
            font-size: 16px;
            line-height: 1.8;
            color: var(--wwc-text);
            margin-bottom: 40px;
            background: white;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid var(--wwc-border);
        }

        /* Products grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: white;
            border-radius: 12px;
            border: 1px solid var(--wwc-border);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
        .product-image {
            height: 160px;
            background: var(--wwc-bg-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            overflow: hidden;
        }
        .product-image img { width: 100%; height: 100%; object-fit: cover; }
        .product-info { padding: 14px; }
        .product-name { font-weight: 700; font-size: 14px; margin-bottom: 6px; color: var(--wwc-dark); }
        .product-price { font-weight: 700; color: var(--wwc-primary); font-size: 15px; }

        /* Loading / error */
        .loading { text-align: center; padding: 60px 20px; color: var(--wwc-text-light); }
        .spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid var(--wwc-border); border-top-color: var(--wwc-primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* RTL support — header is locked ltr, only content flips */
        [dir="rtl"] .producer-hero-inner { flex-direction: row-reverse; }
        [dir="rtl"] .producer-stats { flex-direction: row-reverse; }
    </style>
</head>
<body>

<header class="header" dir="ltr">
    <div class="header-container">
        <a href="/shop/" class="logo">
            <img src="https://wallahwecan.org/wp-content/uploads/2022/05/LOGO-WWC-.png" alt="Wallah We Can">
            <span class="logo-text">Wallah<br>We Can</span>
        </a>
        <nav class="nav">
            <a href="/shop/">Boutique</a>
            <a href="/shop/impact/">Notre Impact</a>
            <a href="/shop/donate/">Faire un don</a>
            <a href="/shop/box-builder/">Composer ma box</a>
        </nav>
        <div class="header-actions">
            <div class="hdr-dropdown" id="lang-dropdown">
                <button class="hdr-dropdown-btn" onclick="toggleDropdown('lang-dropdown')" id="lang-label">FR <svg viewBox="0 0 10 6" width="10" height="10" fill="currentColor"><path d="M0 0l5 6 5-6z"/></svg></button>
                <div class="hdr-dropdown-menu" id="lang-menu">
                    <button class="hdr-dropdown-item" data-lang="fr" onclick="switchLang('fr')">🇫🇷 Français</button>
                    <button class="hdr-dropdown-item" data-lang="en" onclick="switchLang('en')">🇬🇧 English</button>
                    <button class="hdr-dropdown-item" data-lang="ar" onclick="switchLang('ar')">🇹🇳 العربية</button>
                </div>
            </div>
            <a href="/shop/cart/" style="background:none;border:none;font-size:22px;cursor:pointer;color:rgba(255,255,255,0.85);text-decoration:none;padding:6px;transition:color 0.2s;" onmouseover="this.style.color='#e04403'" onmouseout="this.style.color='rgba(255,255,255,0.85)'" title="Mon panier">🛒</a>
            <div id="auth-nav" style="display:flex;align-items:center;gap:10px;"></div>
        </div>
    </div>
</header>

<!-- Producer hero (filled by JS) -->
<div id="hero">
    <div class="loading"><span class="spinner"></span></div>
</div>

<!-- Main content -->
<main class="main" id="main">
    <!-- Products section added by JS -->
</main>

<script>
    const API = '/api/v1';

    // ── Language / i18n ───────────────────────────────────────────
    const LANGS = ['fr', 'en', 'ar'];
    function getLang() {
        const v = localStorage.getItem('wwc_lang');
        return LANGS.includes(v) ? v : 'fr';
    }
    function tObj(obj, field) {
        if (!obj) return '';
        const lang = getLang();
        if (lang === 'fr') return obj[field] || '';
        const loc = obj[`${field}_${lang}`];
        return (loc && loc.trim()) ? loc : (obj[field] || '');
    }
    function toggleDropdown(id) {
        const menu = document.getElementById(id).querySelector('.hdr-dropdown-menu');
        const isOpen = menu.classList.contains('open');
        document.querySelectorAll('.hdr-dropdown-menu.open').forEach(m => m.classList.remove('open'));
        if (!isOpen) menu.classList.add('open');
    }
    document.addEventListener('click', e => {
        if (!e.target.closest('.hdr-dropdown')) {
            document.querySelectorAll('.hdr-dropdown-menu.open').forEach(m => m.classList.remove('open'));
        }
    });
    function renderLangSwitcher() {
        const lang = getLang();
        const labels = { fr: 'FR', en: 'EN', ar: 'ع' };
        const lbl = document.getElementById('lang-label');
        if (lbl) lbl.innerHTML = `${labels[lang] || 'FR'} <svg viewBox="0 0 10 6" width="10" height="10" fill="currentColor"><path d="M0 0l5 6 5-6z"/></svg>`;
        document.querySelectorAll('#lang-menu .hdr-dropdown-item').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.lang === lang);
        });
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    }
    function switchLang(lang) {
        localStorage.setItem('wwc_lang', lang);
        document.querySelectorAll('.hdr-dropdown-menu.open').forEach(m => m.classList.remove('open'));
        renderLangSwitcher();
        const slug = getSlug();
        if (slug) renderAll(slug);
    }

    function getSlug() {
        // URL: /shop/producers/{slug}/
        const parts = window.location.pathname.split('/').filter(Boolean);
        return parts[parts.length - 1] || null;
    }

    function getToken() { return getValidToken(); }

    function getValidToken() {
        const token = localStorage.getItem('wwc_access_token');
        if (!token) return null;
        try {
            const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
            if (payload.exp && payload.exp < Math.floor(Date.now() / 1000)) {
                localStorage.removeItem('wwc_access_token');
                localStorage.removeItem('wwc_refresh_token');
                return null;
            }
        } catch { return null; }
        return token;
    }

    function renderAuthNav() {
        const nav = document.getElementById('auth-nav');
        if (getValidToken()) {
            nav.innerHTML = `
                <a href="/shop/account/" style="color:rgba(255,255,255,0.85);text-decoration:none;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:0.3px;" onmouseover="this.style.color='#e04403'" onmouseout="this.style.color='rgba(255,255,255,0.85)'">Mon compte</a>
                <button onclick="localStorage.removeItem('wwc_access_token');localStorage.removeItem('wwc_refresh_token');renderAuthNav();" style="background:transparent;border:2px solid #e04403;color:#e04403;padding:8px 16px;border-radius:30px;cursor:pointer;font-size:13px;font-weight:700;text-transform:uppercase;" onmouseover="this.style.background='#e04403';this.style.color='white'" onmouseout="this.style.background='transparent';this.style.color='#e04403'">Déconnexion</button>`;
        } else {
            nav.innerHTML = `
                <a href="/shop/login/" style="color:rgba(255,255,255,0.85);text-decoration:none;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:0.3px;" onmouseover="this.style.color='#e04403'" onmouseout="this.style.color='rgba(255,255,255,0.85)'">Connexion</a>
                <a href="/shop/login/?tab=register" style="background:#e04403;color:white;text-decoration:none;padding:10px 20px;border-radius:30px;font-size:13px;font-weight:700;text-transform:uppercase;" onmouseover="this.style.background='white';this.style.color='#e04403'" onmouseout="this.style.background='#e04403';this.style.color='white'">Inscription</a>`;
        }
    }

    function getCurrentCurrency() {
        return localStorage.getItem('wwc_currency') || 'TND';
    }

    function formatPrice(product) {
        const cur = getCurrentCurrency();
        if (cur === 'EUR') return `${product.price_eur} €`;
        return `${product.price_tnd} DT`;
    }

    async function renderAll(slug) {
        try {
            const [prodRes, prodsRes] = await Promise.all([
                fetch(`${API}/producers/${slug}/`),
                fetch(`${API}/producers/${slug}/products/`),
            ]);
            if (!prodRes.ok) throw new Error('Producer not found');
            const producer = await prodRes.json();
            const products = await prodsRes.json();
            renderHero(producer);
            renderProducts(producer, products);
            document.title = `${producer.name} - Wallah We Can`;
        } catch(e) {
            document.getElementById('hero').innerHTML = `
                <div class="loading" style="padding:80px 20px;">
                    <p style="color:#c00;">Producteur introuvable.</p>
                    <a href="/shop/" style="color:var(--wwc-primary);margin-top:16px;display:block;">← Retour à la boutique</a>
                </div>`;
            document.getElementById('main').innerHTML = '';
        }
    }

    function renderHero(p) {
        const memberYear = p.member_since ? new Date(p.member_since).getFullYear() : '—';
        const photoHtml = p.photo
            ? `<div class="producer-photo"><img src="${escH(p.photo)}" alt="${escH(p.name)}"></div>`
            : `<div class="producer-photo">👩‍🌾</div>`;

        document.getElementById('hero').innerHTML = `
            <div class="producer-hero">
                <div class="producer-hero-inner">
                    ${photoHtml}
                    <div class="producer-hero-info">
                        <h1>${escH(p.name)}</h1>
                        <div class="producer-location">📍 ${escH(p.location)}</div>
                        <div class="producer-stats">
                            <div class="producer-stat">
                                <div class="producer-stat-num">${p.total_products_sold.toLocaleString('fr-FR')}</div>
                                <div class="producer-stat-label">Produits vendus</div>
                            </div>
                            <div class="producer-stat">
                                <div class="producer-stat-num">${memberYear}</div>
                                <div class="producer-stat-label">Membre depuis</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
    }

    function renderProducts(producer, products) {
        const bio = tObj(producer, 'bio');
        const bioSection = bio
            ? `<h2 class="section-title">À propos</h2>
               <div class="bio-text">${escH(bio)}</div>`
            : '';

        let productsHtml;
        if (!products || products.length === 0) {
            productsHtml = `<p style="color:var(--wwc-text-light);padding:20px 0;">Aucun produit disponible.</p>`;
        } else {
            productsHtml = `
                <h2 class="section-title">Ses produits (${products.length})</h2>
                <div class="products-grid">
                    ${products.map(p => {
                        const img = p.primary_image?.image
                            ? `<img src="${escH(p.primary_image.image)}" alt="${escH(tObj(p,'name'))}">`
                            : '🧴';
                        return `
                        <div class="product-card" onclick="window.location.href='/shop/product/?slug=${p.slug}'">
                            <div class="product-image">${img}</div>
                            <div class="product-info">
                                <div class="product-name">${escH(tObj(p,'name'))}</div>
                                <div class="product-price">${formatPrice(p)}</div>
                            </div>
                        </div>`;
                    }).join('')}
                </div>`;
        }

        document.getElementById('main').innerHTML = bioSection + productsHtml;
    }

    function escH(str) {
        return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Init
    renderAuthNav();
    renderLangSwitcher();
    const slug = getSlug();
    if (slug) {
        renderAll(slug);
    } else {
        document.getElementById('hero').innerHTML = '<div class="loading"><p>Slug manquant.</p></div>';
    }
</script>
</body>
</html>
