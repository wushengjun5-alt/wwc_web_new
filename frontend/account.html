<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon compte - Wallah We Can</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --wwc-primary: #1e3a5f;
            --wwc-secondary: #ff6b35;
            --wwc-accent: #f8b4c4;
            --wwc-text: #2c3e50;
            --wwc-text-light: #6c757d;
            --wwc-bg: #ffffff;
            --wwc-bg-light: #f8f9fa;
            --wwc-border: #dee2e6;
            --wwc-success: #28a745;
            --wwc-error: #dc3545;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; color: var(--wwc-text); background: var(--wwc-bg-light); }

        .header { background: var(--wwc-primary); padding: 15px 0; position: sticky; top: 0; z-index: 100; }
        .header-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-size: 24px; font-weight: 700; color: white; text-decoration: none; }
        .header-actions { display: flex; gap: 15px; align-items: center; }
        .btn { display: inline-block; padding: 9px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s; border: none; }
        .btn-outline { background: transparent; color: white; border: 2px solid rgba(255,255,255,0.6); }
        .btn-outline:hover { border-color: white; }
        .btn-secondary { background: transparent; color: white; border: 2px solid white; }

        .main { max-width: 900px; margin: 0 auto; padding: 40px 20px; }

        /* Loading */
        .loading-page { text-align: center; padding: 80px 20px; }
        .spinner { width: 48px; height: 48px; border: 4px solid var(--wwc-border); border-top-color: var(--wwc-primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Dashboard */
        .dashboard-header { margin-bottom: 32px; }
        .dashboard-header h1 { font-size: 28px; color: var(--wwc-primary); margin-bottom: 4px; }
        .dashboard-header p { color: var(--wwc-text-light); }

        /* Impact banner */
        .impact-banner {
            background: linear-gradient(135deg, var(--wwc-accent) 0%, #fce8ed 100%);
            border-radius: 16px; padding: 28px; margin-bottom: 32px;
        }
        .impact-banner h2 { margin-bottom: 20px; color: var(--wwc-primary); }
        .impact-cards { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 16px; }
        .impact-card { background: white; border-radius: 12px; padding: 20px; text-align: center; }
        .impact-number { font-size: 36px; font-weight: 700; color: var(--wwc-primary); display: block; }
        .impact-label { font-size: 13px; color: var(--wwc-text-light); }

        /* Section */
        .section { background: white; border-radius: 16px; padding: 28px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .section-title { font-size: 18px; color: var(--wwc-primary); margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }

        /* Orders table */
        .orders-table { width: 100%; border-collapse: collapse; }
        .orders-table th, .orders-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--wwc-border); }
        .orders-table th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--wwc-text-light); background: var(--wwc-bg-light); }
        .orders-table tr:last-child td { border-bottom: none; }
        .orders-table tr:hover td { background: #fafafa; }

        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-pending    { background: #fff3cd; color: #856404; }
        .status-paid       { background: #d4edda; color: #155724; }
        .status-processing { background: #cce5ff; color: #004085; }
        .status-shipped    { background: #e2d4f0; color: #6f42c1; }
        .status-delivered  { background: #d1ecf1; color: #0c5460; }
        .status-cancelled  { background: #f8d7da; color: #721c24; }

        .order-link { color: var(--wwc-primary); font-weight: 600; text-decoration: none; }
        .order-link:hover { text-decoration: underline; }

        .empty-state { text-align: center; padding: 40px; color: var(--wwc-text-light); }
        .empty-state a { color: var(--wwc-secondary); text-decoration: none; font-weight: 600; }

        /* Order detail */
        .order-detail { display: none; }
        .order-detail.active { display: block; }
        .back-btn { background: none; border: none; color: var(--wwc-primary); font-weight: 600; cursor: pointer; font-size: 14px; margin-bottom: 24px; display: flex; align-items: center; gap: 6px; }

        .order-detail-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 2px solid var(--wwc-border); }
        .order-detail-header h2 { font-size: 22px; color: var(--wwc-primary); margin-bottom: 4px; }
        .order-date { font-size: 13px; color: var(--wwc-text-light); }

        .items-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .items-table th, .items-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--wwc-border); }
        .items-table th { font-size: 12px; text-transform: uppercase; color: var(--wwc-text-light); background: var(--wwc-bg-light); }

        .totals-box { background: var(--wwc-bg-light); border-radius: 12px; padding: 20px; }
        .total-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--wwc-border); }
        .total-row:last-child { border-bottom: none; font-size: 18px; font-weight: 700; color: var(--wwc-primary); padding-top: 12px; }

        .address-box { background: var(--wwc-bg-light); border-radius: 12px; padding: 20px; margin-top: 20px; }
        .address-box h4 { margin-bottom: 10px; color: var(--wwc-primary); }

        /* Wishlist */
        .wishlist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
        .wishlist-card { border: 1px solid var(--wwc-border); border-radius: 12px; overflow: hidden; }
        .wishlist-img { height: 110px; background: var(--wwc-bg-light); display: flex; align-items: center; justify-content: center; font-size: 36px; }
        .wishlist-img img { width: 100%; height: 100%; object-fit: cover; }
        .wishlist-info { padding: 10px 12px; }
        .wishlist-name { font-size: 13px; font-weight: 600; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .wishlist-price { font-size: 14px; color: var(--wwc-primary); font-weight: 700; margin-bottom: 8px; }
        .wishlist-actions { display: flex; gap: 6px; }
        .wishlist-btn { flex: 1; padding: 6px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; text-align: center; }
        .wishlist-btn-cart { background: var(--wwc-secondary); color: white; }
        .wishlist-btn-remove { background: white; color: var(--wwc-text-light); border: 1px solid var(--wwc-border) !important; }

        /* Actions */
        .dashboard-actions { display: flex; gap: 12px; margin-top: 8px; }
        .btn-action { padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; border: none; }
        .btn-shop { background: var(--wwc-secondary); color: white; }
        .btn-shop:hover { background: #e55a2b; }
        .btn-logout { background: white; color: var(--wwc-text); border: 1px solid var(--wwc-border); }
        .btn-logout:hover { border-color: var(--wwc-error); color: var(--wwc-error); }

        @media (max-width: 700px) {
            .impact-cards { grid-template-columns: 1fr; }
            .orders-table th:nth-child(4), .orders-table td:nth-child(4) { display: none; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <a href="/shop/" class="logo">WALLAH WE CAN</a>
            <div class="header-actions">
                <a href="/shop/" class="btn btn-outline">← Boutique</a>
                <button class="btn btn-secondary" onclick="logout()">Déconnexion</button>
            </div>
        </div>
    </header>

    <main class="main" id="main">
        <div class="loading-page">
            <div class="spinner"></div>
            <p>Chargement de votre compte…</p>
        </div>
    </main>

    <script>
        const API_URL = 'http://127.0.0.1:8000/api/v1';

        function getToken() { return localStorage.getItem('wwc_access_token'); }
        function clearTokens() {
            localStorage.removeItem('wwc_access_token');
            localStorage.removeItem('wwc_refresh_token');
        }

        // Redirect if not logged in
        if (!getToken()) {
            window.location.href = '/shop/login/?redirect=/shop/account/';
        }

        function authHeaders() {
            return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` };
        }

        async function logout() {
            clearTokens();
            window.location.href = '/shop/';
        }

        const urlParams = new URLSearchParams(window.location.search);
        const orderParam = urlParams.get('order');

        document.addEventListener('DOMContentLoaded', async () => {
            if (orderParam) {
                await loadOrderDetail(orderParam);
            } else {
                await loadDashboard();
            }
        });

        // ─── Dashboard ─────────────────────────────────────────────

        async function loadDashboard() {
            try {
                const res = await fetch(`${API_URL}/customer/dashboard/`, {
                    headers: authHeaders(), credentials: 'include'
                });
                if (res.status === 401) { clearTokens(); window.location.href = '/shop/login/'; return; }
                const data = await res.json();
                renderDashboard(data);
            } catch (err) {
                document.getElementById('main').innerHTML = `<p style="color:red; text-align:center; padding:60px;">Erreur de chargement. <a href="/shop/">Retour</a></p>`;
            }
        }

        function renderDashboard(data) {
            const customer   = data.customer   || {};
            const orders     = data.recent_orders || [];
            const impact     = data.impact_summary || {};
            const firstName  = customer.first_name || 'vous';

            const statusLabels = {
                pending: 'En attente', paid: 'Payée', processing: 'En traitement',
                shipped: 'Expédiée', delivered: 'Livrée', cancelled: 'Annulée'
            };

            const ordersRows = orders.length === 0
                ? `<tr><td colspan="5"><div class="empty-state">
                        Aucune commande pour le moment.
                        <a href="/shop/">Découvrir nos produits →</a>
                   </div></td></tr>`
                : orders.map(o => `
                    <tr>
                        <td><a class="order-link" href="/shop/account/?order=${o.order_number}">#${o.order_number}</a></td>
                        <td>${formatDate(o.created_at)}</td>
                        <td><span class="status-badge status-${o.status}">${statusLabels[o.status] || o.status}</span></td>
                        <td>${o.total} ${o.currency}</td>
                        <td>💝 ${o.item_count || '—'}</td>
                    </tr>`).join('');

            document.getElementById('main').innerHTML = `
                <div class="dashboard-header">
                    <h1>Bonjour, ${escHtml(firstName)} 👋</h1>
                    <p>Bienvenue dans votre espace personnel.</p>
                </div>

                <div class="impact-banner">
                    <h2>💝 Votre impact</h2>
                    <div class="impact-cards">
                        <div class="impact-card">
                            <span class="impact-number">${impact.total_items || 0}</span>
                            <span class="impact-label">items fournis aux étudiants</span>
                        </div>
                        <div class="impact-card">
                            <span class="impact-number">${impact.total_orders || 0}</span>
                            <span class="impact-label">commandes</span>
                        </div>
                        <div class="impact-card">
                            <span class="impact-number">${impact.total_purchases || '0'} DT</span>
                            <span class="impact-label">d'achats</span>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">
                        Mes commandes récentes
                        <a href="javascript:void(0)" onclick="loadAllOrders()" style="font-size:14px; color:var(--wwc-secondary); text-decoration:none; font-weight:600;">Voir toutes →</a>
                    </div>
                    <table class="orders-table">
                        <thead>
                            <tr>
                                <th>Commande</th><th>Date</th><th>Statut</th><th>Total</th><th>Impact</th>
                            </tr>
                        </thead>
                        <tbody>${ordersRows}</tbody>
                    </table>
                </div>

                <div id="wishlist-section"></div>

                <div class="dashboard-actions">
                    <a href="/shop/" class="btn-action btn-shop">Continuer mes achats</a>
                    <button class="btn-action btn-logout" onclick="logout()">Déconnexion</button>
                </div>
            `;

            loadWishlistSection();
        }

        // ─── Wishlist ───────────────────────────────────────────────

        async function loadWishlistSection() {
            const section = document.getElementById('wishlist-section');
            if (!section) return;
            try {
                const res = await fetch(`${API_URL}/wishlist/`, {
                    headers: { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' }
                });
                if (!res.ok) return;
                const data = await res.json();
                const items = data.results || data;
                renderWishlist(items);
            } catch {}
        }

        function renderWishlist(items) {
            const section = document.getElementById('wishlist-section');
            if (!section) return;

            if (items.length === 0) {
                section.innerHTML = `
                    <div class="section">
                        <div class="section-title">Mes favoris</div>
                        <div class="empty-state">Aucun produit en favoris pour le moment. <a href="/shop/">Découvrir nos produits →</a></div>
                    </div>`;
                return;
            }

            const cards = items.map(w => {
                const p = w.product || {};
                const img = p.primary_image?.image
                    ? `<img src="${p.primary_image.image}" alt="${escHtml(p.name || '')}">`
                    : '🧴';
                return `
                <div class="wishlist-card" id="wl-${w.id}">
                    <a href="/shop/product/?slug=${p.slug || ''}" style="text-decoration:none;color:inherit;">
                        <div class="wishlist-img">${img}</div>
                    </a>
                    <div class="wishlist-info">
                        <div class="wishlist-name" title="${escHtml(p.name || '')}">${escHtml(p.name || '—')}</div>
                        <div class="wishlist-price">${p.price_tnd || '—'} DT</div>
                        <div class="wishlist-actions">
                            <button class="wishlist-btn wishlist-btn-remove" onclick="removeFromWishlist(${w.id})">Retirer</button>
                        </div>
                    </div>
                </div>`;
            }).join('');

            section.innerHTML = `
                <div class="section">
                    <div class="section-title">Mes favoris <span style="font-size:14px;font-weight:400;color:var(--wwc-text-light);">${items.length} produit${items.length > 1 ? 's' : ''}</span></div>
                    <div class="wishlist-grid">${cards}</div>
                </div>`;
        }

        async function removeFromWishlist(wishlistId) {
            try {
                const res = await fetch(`${API_URL}/wishlist/${wishlistId}/`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                if (res.ok || res.status === 204) {
                    const card = document.getElementById(`wl-${wishlistId}`);
                    if (card) card.remove();
                    // Check if grid is now empty
                    const grid = document.querySelector('.wishlist-grid');
                    if (grid && grid.children.length === 0) {
                        loadWishlistSection();
                    }
                }
            } catch {}
        }

        // ─── All Orders ─────────────────────────────────────────────

        let _ordersPage = 1;

        async function loadAllOrders(page = 1) {
            _ordersPage = page;
            document.getElementById('main').innerHTML = `<div class="loading-page"><div class="spinner"></div><p>Chargement…</p></div>`;
            try {
                const res = await fetch(`${API_URL}/orders/?page=${page}&page_size=10`, { headers: authHeaders() });
                if (res.status === 401) { clearTokens(); window.location.href = '/shop/login/'; return; }
                const data = await res.json();
                renderAllOrders(data, page);
            } catch {
                document.getElementById('main').innerHTML = `<p style="color:red;text-align:center;padding:60px;">Erreur. <a href="/shop/account/">Retour</a></p>`;
            }
        }

        function renderAllOrders(data, page) {
            const orders = data.results || [];
            const total = data.count || orders.length;
            const totalPages = Math.ceil(total / 10);

            const statusLabels = {
                pending: 'En attente', paid: 'Payée', processing: 'En traitement',
                shipped: 'Expédiée', delivered: 'Livrée', cancelled: 'Annulée'
            };

            const rows = orders.length === 0
                ? `<tr><td colspan="5"><div class="empty-state">Aucune commande. <a href="/shop/">Découvrir nos produits →</a></div></td></tr>`
                : orders.map(o => `
                    <tr>
                        <td><a class="order-link" href="/shop/account/?order=${o.order_number}">#${o.order_number}</a></td>
                        <td>${formatDate(o.created_at)}</td>
                        <td><span class="status-badge status-${o.status}">${statusLabels[o.status] || o.status}</span></td>
                        <td>${o.total} ${o.currency}</td>
                        <td>💝 ${o.item_count || '—'}</td>
                    </tr>`).join('');

            const paginationHtml = totalPages > 1 ? `
                <div style="display:flex; justify-content:center; align-items:center; gap:12px; margin-top:20px;">
                    ${page > 1 ? `<button class="btn-action btn-logout" onclick="loadAllOrders(${page - 1})">← Précédent</button>` : ''}
                    <span style="font-size:14px; color:var(--wwc-text-light);">Page ${page} / ${totalPages}</span>
                    ${page < totalPages ? `<button class="btn-action btn-logout" onclick="loadAllOrders(${page + 1})">Suivant →</button>` : ''}
                </div>` : '';

            document.getElementById('main').innerHTML = `
                <button class="back-btn" onclick="loadDashboard()">← Retour au tableau de bord</button>
                <div class="section">
                    <div class="section-title">
                        Toutes mes commandes
                        <span style="font-size:14px; font-weight:400; color:var(--wwc-text-light);">${total} commande${total > 1 ? 's' : ''}</span>
                    </div>
                    <table class="orders-table">
                        <thead><tr><th>Commande</th><th>Date</th><th>Statut</th><th>Total</th><th>Impact</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                    ${paginationHtml}
                </div>
            `;
        }

        // ─── Order Detail ───────────────────────────────────────────

        async function loadOrderDetail(orderNumber) {
            try {
                const res = await fetch(`${API_URL}/orders/${orderNumber}/`, {
                    headers: authHeaders(), credentials: 'include'
                });
                if (res.status === 401) { clearTokens(); window.location.href = '/shop/login/'; return; }
                if (res.status === 404) {
                    document.getElementById('main').innerHTML = `<p style="text-align:center;padding:60px;">Commande introuvable. <a href="/shop/account/">Retour</a></p>`;
                    return;
                }
                const order = await res.json();
                renderOrderDetail(order);
            } catch (err) {
                document.getElementById('main').innerHTML = `<p style="color:red;text-align:center;padding:60px;">Erreur. <a href="/shop/account/">Retour</a></p>`;
            }
        }

        function renderOrderDetail(order) {
            const statusLabels = {
                pending: 'En attente', paid: 'Payée', processing: 'En traitement',
                shipped: 'Expédiée', delivered: 'Livrée', cancelled: 'Annulée'
            };
            const symbol = order.currency === 'EUR' ? '€' : 'DT';
            const items = order.items || [];

            const itemsRows = items.map(item => `
                <tr>
                    <td>
                        <div style="font-weight:500;">${escHtml(item.product_name || item.product?.name || '—')}</div>
                        ${item.impact_items ? `<div style="font-size:12px;color:var(--wwc-text-light);">💝 ${item.impact_items} items</div>` : ''}
                    </td>
                    <td>${item.quantity}</td>
                    <td>${item.unit_price} ${symbol}</td>
                    <td style="font-weight:600;">${item.subtotal} ${symbol}</td>
                </tr>`).join('');

            document.getElementById('main').innerHTML = `
                <button class="back-btn" onclick="window.location.href='/shop/account/'">
                    ← Retour à mon compte
                </button>

                <div class="section">
                    <div class="order-detail-header">
                        <div>
                            <h2>Commande #${escHtml(order.order_number)}</h2>
                            <div class="order-date">Passée le ${formatDate(order.created_at)}</div>
                        </div>
                        <span class="status-badge status-${order.status}">
                            ${statusLabels[order.status] || order.status}
                        </span>
                    </div>

                    <h4 style="margin-bottom:12px;">Articles</h4>
                    <table class="items-table">
                        <thead><tr><th>Produit</th><th>Qté</th><th>Prix unit.</th><th>Sous-total</th></tr></thead>
                        <tbody>${itemsRows}</tbody>
                    </table>

                    <div class="totals-box">
                        <div class="total-row"><span>Sous-total</span><span>${order.subtotal} ${symbol}</span></div>
                        ${parseFloat(order.shipping_cost) > 0
                            ? `<div class="total-row"><span>Livraison</span><span>${order.shipping_cost} ${symbol}</span></div>`
                            : ''}
                        ${parseFloat(order.discount_amount) > 0
                            ? `<div class="total-row" style="color:var(--wwc-success);"><span>Remise${order.coupon_code ? ` (${escHtml(order.coupon_code)})` : ''}</span><span>-${order.discount_amount} ${symbol}</span></div>`
                            : ''}
                        ${parseFloat(order.tax_amount) > 0
                            ? `<div class="total-row"><span>🎁 Emballage cadeau</span><span>${order.tax_amount} ${symbol}</span></div>`
                            : ''}
                        <div class="total-row"><span>Total</span><span>${order.total} ${symbol}</span></div>
                    </div>

                    <div style="margin-top:16px; font-size:14px; color:var(--wwc-text-light);">
                        Paiement :
                        <strong style="color:var(--wwc-text);">${{
                            stripe: 'Carte bancaire (Stripe)',
                            bank_transfer: 'Virement bancaire',
                            cash_on_delivery: 'Paiement à la livraison'
                        }[order.payment_method] || order.payment_method}</strong>
                    </div>

                    ${order.shipping_address_1 ? `
                    <div class="address-box">
                        <h4>Adresse de livraison</h4>
                        <address style="font-style:normal;line-height:1.8;">
                            ${escHtml(((order.shipping_first_name || '') + ' ' + (order.shipping_last_name || '')).trim())}<br>
                            ${escHtml(order.shipping_address_1)}<br>
                            ${order.shipping_address_2 ? escHtml(order.shipping_address_2) + '<br>' : ''}
                            ${escHtml(((order.shipping_postal_code || '') + ' ' + (order.shipping_city || '')).trim())}<br>
                            ${escHtml(order.shipping_country || '')}
                        </address>
                    </div>` : ''}

                    ${order.tracking_number ? `
                    <div class="address-box" style="margin-top:12px;">
                        <h4>Suivi</h4>
                        <p>Numéro de suivi : <strong>${escHtml(order.tracking_number)}</strong></p>
                    </div>` : ''}
                </div>
            `;
        }

        // ─── Helpers ────────────────────────────────────────────────

        function formatDate(iso) {
            if (!iso) return '—';
            return new Date(iso).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        function escHtml(str) {
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }
    </script>
</body>
</html>
