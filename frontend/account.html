<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon compte - Wallah We Can</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --wwc-primary: #e04403;
            --wwc-secondary: #1c345e;
            --wwc-dark: #191919;
            --wwc-text: #404040;
            --wwc-text-light: #888888;
            --wwc-bg: #ffffff;
            --wwc-bg-light: #f5f5f5;
            --wwc-border: #ececec;
            --wwc-success: #28a745;
            --wwc-error: #dc3545;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans', sans-serif; color: var(--wwc-text); background: var(--wwc-bg-light); }

        .header { background: #1c345e; padding: 0; height: 80px; position: sticky; top: 0; z-index: 200; }
        .header-container { max-width: 1200px; margin: 0 auto; padding: 0 24px; height: 80px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
        .logo { display: flex; align-items: center; text-decoration: none; flex-shrink: 0; }
        .logo img { height: 48px; width: auto; display: block; }
        .header-actions { display: flex; gap: 12px; align-items: center; }
        .btn { display: inline-block; padding: 9px 20px; border-radius: 30px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; cursor: pointer; text-decoration: none; transition: all 0.2s; border: none; }
        .btn-outline { background: transparent; color: #191919; border: 2px solid #ececec; }
        .btn-outline:hover { border-color: #e04403; color: #e04403; }
        .btn-secondary { background: transparent; color: #191919; border: 2px solid #ececec; }
        .btn-secondary:hover { border-color: #dc3545; color: #dc3545; }

        .main { max-width: 900px; margin: 0 auto; padding: 40px 20px; }

        /* Loading */
        .loading-page { text-align: center; padding: 80px 20px; }
        .spinner { width: 48px; height: 48px; border: 4px solid var(--wwc-border); border-top-color: #e04403; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Dashboard */
        .dashboard-header { margin-bottom: 32px; }
        .dashboard-header h1 { font-family: 'Montserrat', sans-serif; font-size: 28px; color: var(--wwc-secondary); margin-bottom: 4px; }
        .dashboard-header p { color: var(--wwc-text-light); }

        /* Impact banner */
        .impact-banner {
            background: linear-gradient(135deg, #1c345e 0%, #e04403 100%);
            border-radius: 16px; padding: 28px; margin-bottom: 32px;
        }
        .impact-banner h2 { margin-bottom: 20px; color: white; font-family: 'Montserrat', sans-serif; }
        .impact-cards { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 16px; }
        .impact-card { background: white; border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0 2px 16px rgba(0,0,0,0.08); }
        .impact-number { font-family: 'Montserrat', sans-serif; font-size: 36px; font-weight: 700; color: #e04403; display: block; }
        .impact-label { font-size: 13px; color: var(--wwc-text-light); }
        .impact-breakdown { margin-top: 20px; background: rgba(255,255,255,0.12); border-radius: 12px; padding: 16px; }
        .impact-breakdown h3 { color: white; font-size: 14px; font-weight: 600; margin-bottom: 10px; opacity: 0.9; }
        .impact-breakdown-items { display: flex; flex-wrap: wrap; gap: 10px; }
        .impact-breakdown-item { background: rgba(255,255,255,0.2); border-radius: 8px; padding: 8px 14px; display: flex; align-items: center; gap: 8px; }
        .impact-breakdown-item strong { color: white; font-size: 20px; font-family: 'Montserrat', sans-serif; }
        .impact-breakdown-item span { color: rgba(255,255,255,0.9); font-size: 13px; }

        /* Section */
        .section { background: white; border-radius: 16px; padding: 28px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .section-title { font-family: 'Montserrat', sans-serif; font-size: 18px; color: var(--wwc-secondary); margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }

        /* Orders table */
        .orders-table { width: 100%; border-collapse: collapse; }
        .orders-table th, .orders-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--wwc-border); }
        .orders-table th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--wwc-text-light); background: var(--wwc-bg-light); }
        .orders-table tr:last-child td { border-bottom: none; }
        .orders-table tr:hover td { background: #fafafa; }

        .status-badge { padding: 4px 12px; border-radius: 30px; font-size: 12px; font-weight: 600; }
        .status-pending    { background: #fff3cd; color: #856404; }
        .status-paid       { background: #d4edda; color: #155724; }
        .status-processing { background: #cce5ff; color: #004085; }
        .status-shipped    { background: #e2d4f0; color: #6f42c1; }
        .status-delivered  { background: #d1ecf1; color: #0c5460; }
        .status-cancelled  { background: #f8d7da; color: #721c24; }

        .order-link { color: #e04403; font-weight: 600; text-decoration: none; }
        .order-link:hover { text-decoration: underline; color: #1c345e; }

        .empty-state { text-align: center; padding: 40px; color: var(--wwc-text-light); }
        .empty-state a { color: #e04403; text-decoration: none; font-weight: 600; }

        /* Order detail */
        .order-detail { display: none; }
        .order-detail.active { display: block; }
        .back-btn { background: none; border: none; color: #e04403; font-weight: 600; cursor: pointer; font-size: 14px; margin-bottom: 24px; display: flex; align-items: center; gap: 6px; }

        .order-detail-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 2px solid var(--wwc-border); }
        .order-detail-header h2 { font-family: 'Montserrat', sans-serif; font-size: 22px; color: var(--wwc-secondary); margin-bottom: 4px; }
        .order-date { font-size: 13px; color: var(--wwc-text-light); }

        .items-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .items-table th, .items-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--wwc-border); }
        .items-table th { font-size: 12px; text-transform: uppercase; color: var(--wwc-text-light); background: var(--wwc-bg-light); }

        .totals-box { background: var(--wwc-bg-light); border-radius: 12px; padding: 20px; }
        .total-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--wwc-border); }
        .total-row:last-child { border-bottom: none; font-size: 18px; font-weight: 700; color: var(--wwc-secondary); padding-top: 12px; }

        .address-box { background: var(--wwc-bg-light); border-radius: 12px; padding: 20px; margin-top: 20px; }
        .address-box h4 { margin-bottom: 10px; color: var(--wwc-secondary); }

        /* Wishlist */
        .wishlist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
        .wishlist-card { border: 1px solid var(--wwc-border); border-radius: 12px; overflow: hidden; }
        .wishlist-img { height: 110px; background: var(--wwc-bg-light); display: flex; align-items: center; justify-content: center; font-size: 36px; }
        .wishlist-img img { width: 100%; height: 100%; object-fit: cover; }
        .wishlist-info { padding: 10px 12px; }
        .wishlist-name { font-size: 13px; font-weight: 600; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .wishlist-price { font-size: 14px; color: #e04403; font-weight: 700; margin-bottom: 8px; }
        .wishlist-actions { display: flex; gap: 6px; }
        .wishlist-btn { flex: 1; padding: 6px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; text-align: center; }
        .wishlist-btn-cart { background: #e04403; color: white; }
        .wishlist-btn-remove { background: white; color: var(--wwc-text-light); border: 1px solid var(--wwc-border) !important; }

        /* Actions */
        .dashboard-actions { display: flex; gap: 12px; margin-top: 8px; }
        .btn-action { padding: 10px 24px; border-radius: 30px; font-size: 14px; font-weight: 700; text-transform: uppercase; cursor: pointer; text-decoration: none; border: none; }
        .btn-shop { background: #e04403; color: white; }
        .btn-shop:hover { background: #1c345e; }
        .btn-logout { background: white; color: var(--wwc-text); border: 1px solid var(--wwc-border); }
        .btn-logout:hover { border-color: var(--wwc-error); color: var(--wwc-error); }

        /* Settings */
        .settings-label { display: block; font-size: 13px; font-weight: 600; color: var(--wwc-text-light); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px; }
        .settings-input { width: 100%; padding: 10px 14px; border: 1.5px solid var(--wwc-border); border-radius: 8px; font-size: 14px; font-family: inherit; color: var(--wwc-text); background: white; transition: border-color 0.2s; }
        .settings-input:focus { outline: none; border-color: #e04403; }
        .settings-btn { background: #e04403; color: white; border: none; padding: 11px 28px; border-radius: 30px; font-size: 14px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 0.3px; transition: background 0.2s; }
        .settings-btn:hover { background: #1c345e; }

        @media (max-width: 700px) {
            .impact-cards { grid-template-columns: 1fr; }
            .orders-table th:nth-child(4), .orders-table td:nth-child(4) { display: none; }
            .settings-input { font-size: 16px; } /* prevent zoom on mobile */
        }

        /* Language dropdown */
        .hdr-dropdown { position: relative; }
        .hdr-dropdown-btn { display: flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); color: white; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .hdr-dropdown-btn:hover { background: rgba(255,255,255,0.22); }
        .hdr-dropdown-menu { display: none; position: absolute; top: calc(100% + 6px); right: 0; background: white; border: 1px solid #ececec; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); overflow: hidden; min-width: 120px; z-index: 300; }
        .hdr-dropdown-menu.open { display: block; }
        .hdr-dropdown-item { display: block; width: 100%; padding: 9px 16px; background: none; border: none; text-align: left; font-size: 13px; font-weight: 600; color: #404040; cursor: pointer; white-space: nowrap; transition: background 0.15s, color 0.15s; }
        .hdr-dropdown-item:hover { background: #f5f5f5; color: #e04403; }
        .hdr-dropdown-item.active { color: #e04403; background: rgba(224,68,3,0.07); }

        /* RTL support */
        [dir=rtl] .hdr-dropdown-menu { right: auto; left: 0; }
        [dir=rtl] .hdr-dropdown-item { text-align: right; }
        [dir=rtl] .orders-table th, [dir=rtl] .orders-table td { text-align: right; }
    </style>
</head>

        function t(key) { return (T[getLang()] || T.fr)[key] || T.fr[key] || key; }
        function applyTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                el.textContent = t(key);
            });

            document.documentElement.dir = getLang() === 'ar' ? 'rtl' : 'ltr';
        }
        function renderLangSwitcher() {
            const lang = getLang();
            const labels = { fr: 'FR', en: 'EN', ar: 'ع' };

            if (lbl) lbl.innerHTML = `${labels[lang]} <svg viewBox="0 0 10 6" style="width:8px;fill:white"><path d="M0 0l5 6 5-6z"/></svg>`;
            document.querySelectorAll('[data-lang]').forEach(el => {
                el.classList.toggle('active', el.dataset.lang === lang);
            });
            applyTranslations();
        }
        function switchLang(lang) {
            localStorage.setItem('wwc_lang', lang);
            document.querySelectorAll('.hdr-dropdown-menu.open').forEach(m => m.classList.remove('open'));

        function toggleDropdown(id) {
            const menu = document.getElementById(id).querySelector('.hdr-dropdown-menu');
            menu.classList.toggle('open');
            document.addEventListener('click', function handler(e) {
                if (!document.getElementById(id).contains(e.target)) {
                    menu.classList.remove('open');
                    document.removeEventListener('click', handler);
                }
            });

        // ─────────────────────────────────────────────────────────────

        const API_URL = '/api/v1';

        function getToken() {
            const token = localStorage.getItem('wwc_access_token');
            if (!token) return null;
            try {
                const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
                if (payload.exp && payload.exp < Math.floor(Date.now() / 1000)) {
                    localStorage.removeItem('wwc_access_token');
                    localStorage.removeItem('wwc_refresh_token');
                    return null;
                }
            } catch { return null; }
            return token;
        }
        function clearTokens() {
            localStorage.removeItem('wwc_access_token');
            localStorage.removeItem('wwc_refresh_token');
        }

        // Redirect if not logged in
        if (!getToken()) {
            window.location.href = '/shop/login/?redirect=/shop/account/';
        }

        function authHeaders() {
            return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` };
        }

        async function logout() {
            clearTokens();
            window.location.href = '/shop/';
        }

        const urlParams = new URLSearchParams(window.location.search);
        const orderParam = urlParams.get('order');
        const tabParam   = urlParams.get('tab');

        document.addEventListener('DOMContentLoaded', async () => {
            if (orderParam) {
                await loadOrderDetail(orderParam);

                await loadSettings();
            } else {
                await loadDashboard();
            }
        });

                const data = await res.json();
                if (!res.ok) {
                    const msg = data.detail || data.error || `Erreur ${res.status}`;
                    document.getElementById('main').innerHTML = `<p style="color:red; text-align:center; padding:60px;">${escHtml(msg)} <a href="/shop/">Retour</a></p>`;

        // ─── Wishlist ───────────────────────────────────────────────

        async function loadWishlistSection() {
            const section = document.getElementById('wishlist-section');
            if (!section) return;
            try {
                const res = await fetch(`${API_URL}/wishlist/`, {
                    headers: { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' }
                });
                if (!res.ok) return;
                const data = await res.json();
                const items = data.results || data;
                renderWishlist(items);
            } catch {}
        }

        function renderWishlist(items) {
            const section = document.getElementById('wishlist-section');
            if (!section) return;

            if (items.length === 0) {
                section.innerHTML = `
                    <div class="section">
                        <div class="section-title">${t('my_favorites')}</div>
                        <div class="empty-state">${t('no_favorites')} <a href="/shop/">${t('discover')}</a></div>
                    </div>`;
                return;
            }

            const cards = items.map(w => {
                const p = w.product || {};
                const img = p.primary_image?.image
                    ? `<img src="${p.primary_image.image}" alt="${escHtml(p.name || '')}">`
                    : '🧴';
                return `
                <div class="wishlist-card" id="wl-${w.id}">
                    <a href="/shop/product/?slug=${p.slug || ''}" style="text-decoration:none;color:inherit;">
                        <div class="wishlist-img">${img}</div>
                    </a>
                    <div class="wishlist-info">
                        <div class="wishlist-name" title="${escHtml(p.name || '')}">${escHtml(p.name || '—')}</div>
                        <div class="wishlist-price">${p.price_tnd || '—'} DT</div>
                        <div class="wishlist-actions">
                            <button class="wishlist-btn wishlist-btn-remove" onclick="removeFromWishlist(${w.id})">${t('remove')}</button>
                        </div>
                    </div>
                </div>`;
            }).join('');

            section.innerHTML = `
                <div class="section">
                    <div class="section-title">${t('my_favorites')} <span style="font-size:14px;font-weight:400;color:var(--wwc-text-light);">${items.length} produit${items.length > 1 ? 's' : ''}</span></div>
                    <div class="wishlist-grid">${cards}</div>
                </div>`;
        }

        async function removeFromWishlist(wishlistId) {
            try {
                const res = await fetch(`${API_URL}/wishlist/${wishlistId}/`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                if (res.ok || res.status === 204) {
                    const card = document.getElementById(`wl-${wishlistId}`);
                    if (card) card.remove();
                    // Check if grid is now empty
                    const grid = document.querySelector('.wishlist-grid');
                    if (grid && grid.children.length === 0) {
                        loadWishlistSection();
                    }
                }
            } catch {}
        }

        async function loadAllOrders(page = 1) {
            _ordersPage = page;
            document.getElementById('main').innerHTML = `<div class="loading-page"><div class="spinner"></div><p>Chargement…</p></div>`;
            try {
                const res = await fetch(`${API_URL}/orders/?page=${page}&page_size=10`, { headers: authHeaders() });
                if (res.status === 401) { clearTokens(); window.location.href = '/shop/login/'; return; }
                const data = await res.json();
                renderAllOrders(data, page);
            } catch {
                document.getElementById('main').innerHTML = `<p style="color:red;text-align:center;padding:60px;">Erreur. <a href="/shop/account/">Retour</a></p>`;
            }
        }

        function renderAllOrders(data, page) {
            const orders = data.results || [];
            const total = data.count || orders.length;
            const totalPages = Math.ceil(total / 10);

            const statusLabels = {
                pending: t('status_pending'), paid: t('status_paid'), processing: t('status_processing'),
                shipped: t('status_shipped'), delivered: t('status_delivered'), cancelled: t('status_cancelled')
            };

            const rows = orders.length === 0
                ? `<tr><td colspan="5"><div class="empty-state">${t('no_orders')} <a href="/shop/">${t('discover')}</a></div></td></tr>`

                    <tr>
                        <td><a class="order-link" href="/shop/account/?order=${o.order_number}">#${o.order_number}</a></td>
                        <td>${formatDate(o.created_at)}</td>
                        <td><span class="status-badge status-${o.status}">${statusLabels[o.status] || o.status}</span></td>
                        <td>${o.total} ${o.currency}</td>
                        <td>💝 ${o.item_count || '—'}</td>
                    </tr>`).join('');

            const prevLabel = getLang() === 'ar' ? 'التالي ←' : '← Précédent';
            const nextLabel = getLang() === 'ar' ? '→ السابق' : 'Suivant →';
            const paginationHtml = totalPages > 1 ? `
                <div style="display:flex; justify-content:center; align-items:center; gap:12px; margin-top:20px;">

                    <div class="section-title">
                        ${t('all_orders')}

                                ? `<p style="font-size:13px;color:var(--wwc-text-light);">Identique à l'adresse de livraison</p>`
                                : `<address style="font-style:normal;line-height:1.8;font-size:14px;">
                                    ${order.billing_company ? escHtml(order.billing_company) + '<br>' : ''}
                                    ${escHtml(((order.billing_first_name || '') + ' ' + (order.billing_last_name || '')).trim())}<br>
                                    ${escHtml(order.billing_address_1 || '')}<br>
                                    ${order.billing_address_2 ? escHtml(order.billing_address_2) + '<br>' : ''}
                                    ${escHtml(((order.billing_postal_code || '') + ' ' + (order.billing_city || '')).trim())}<br>
                                    ${escHtml(order.billing_country || '')}
                                </address>`
                            }
                        </div>
                    </div>

                    ${order.tracking_number ? `
                    <div class="address-box" style="margin-top:12px;">
                        <h4>Suivi</h4>
                        <p>Numéro de suivi : <strong>${escHtml(order.tracking_number)}</strong></p>
                    </div>` : ''}
                </div>
            `;
        }

        // ─── Helpers ────────────────────────────────────────────────

        function formatDate(iso) {
            if (!iso) return '—';
            return new Date(iso).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        function escHtml(str) {
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        // ─── Settings ──────────────────────────────────────────────

        async function loadSettings() {
            document.getElementById('main').innerHTML = `<div class="loading-page"><div class="spinner"></div><p>Chargement…</p></div>`;
            try {
                const res = await fetch(`${API_URL}/customer/profile/`, { headers: authHeaders() });
                if (res.status === 401) { clearTokens(); window.location.href = '/shop/login/'; return; }
                const customer = await res.json();
                renderSettings(customer);
            } catch (e) {
                document.getElementById('main').innerHTML = `<p style="color:red;text-align:center;padding:60px;">Erreur de chargement.</p>`;
            }
        }

        function renderSettings(c) {
            document.getElementById('main').innerHTML = `
                <div class="dashboard-header">
                    <button class="back-btn" onclick="window.location.href='/shop/account/'">${t('back_dashboard')}</button>
                    <h1>${t('settings_title')}</h1>
                </div>

                <!-- Toast -->
                <div id="settings-toast" style="display:none;padding:12px 20px;border-radius:10px;margin-bottom:20px;font-weight:600;font-size:14px;"></div>

                <!-- Profile info -->
                <div class="section">
                    <div class="section-title">${t('personal_info')}</div>
                    <form id="form-profile" onsubmit="saveProfile(event)">
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
                            <div>
                                <label class="settings-label">${t('label_first_name')}</label>
                                <input class="settings-input" type="text" id="s-first-name" value="${escHtml(c.first_name || '')}" required>
                            </div>
                            <div>
                                <label class="settings-label">${t('label_last_name')}</label>
                                <input class="settings-input" type="text" id="s-last-name" value="${escHtml(c.last_name || '')}" required>
                            </div>
                        </div>
                        <div style="margin-bottom:16px;">
                            <label class="settings-label">${t('label_email')}</label>
                            <input class="settings-input" type="email" value="${escHtml(c.email || '')}" disabled style="opacity:0.6;cursor:not-allowed;" title="${t('email_readonly')}">
                            <small style="color:var(--wwc-text-light);font-size:12px;">${t('email_readonly')}</small>
                        </div>
                        <div style="margin-bottom:16px;">
                            <label class="settings-label">${t('label_phone')}</label>
                            <input class="settings-input" type="tel" id="s-phone" value="${escHtml(c.phone || '')}">
                        </div>
                        ${c.customer_type === 'company' ? `
                        <div style="margin-bottom:16px;">
                            <label class="settings-label">${t('label_company')}</label>
                            <input class="settings-input" type="text" id="s-company" value="${escHtml(c.company_name || '')}">
                        </div>
                        <div style="margin-bottom:16px;">
                            <label class="settings-label">${t('label_tax_id')}</label>
                            <input class="settings-input" type="text" id="s-tax-id" value="${escHtml(c.company_tax_id || '')}">
                        </div>` : ''}
                        <button type="submit" class="settings-btn">${t('btn_save_profile')}</button>
                    </form>
                </div>

                <!-- Shipping address -->
                <div class="section">
                    <div class="section-title">${t('shipping_address')}</div>
                    <form id="form-address" onsubmit="saveAddress(event)">
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
                            <div>
                                <label class="settings-label">${t('label_first_name')}</label>
                                <input class="settings-input" type="text" id="a-first-name" value="${escHtml(c.default_shipping_first_name || c.first_name || '')}">
                            </div>
                            <div>
                                <label class="settings-label">${t('label_last_name')}</label>
                                <input class="settings-input" type="text" id="a-last-name" value="${escHtml(c.default_shipping_last_name || c.last_name || '')}">
                            </div>
                        </div>
                        <div style="margin-bottom:16px;">
                            <label class="settings-label">${t('label_address')}</label>
                            <input class="settings-input" type="text" id="a-address1" value="${escHtml(c.default_shipping_address_1 || '')}" placeholder="Rue, numéro...">
                        </div>
                        <div style="margin-bottom:16px;">
                            <label class="settings-label">${t('label_address2')}</label>
                            <input class="settings-input" type="text" id="a-address2" value="${escHtml(c.default_shipping_address_2 || '')}" placeholder="Appartement, étage...">
                        </div>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
                            <div>
                                <label class="settings-label">${t('label_city')}</label>
                                <input class="settings-input" type="text" id="a-city" value="${escHtml(c.default_shipping_city || '')}">
                            </div>
                            <div>
                                <label class="settings-label">${t('label_postal')}</label>
                                <input class="settings-input" type="text" id="a-postal" value="${escHtml(c.default_shipping_postal_code || '')}">
                            </div>
                        </div>
                        <div style="margin-bottom:16px;">
                            <label class="settings-label">${t('label_country')}</label>
                            <select class="settings-input" id="a-country">
                                ${[['TN','Tunisie'],['FR','France'],['BE','Belgique'],['CH','Suisse'],['MA','Maroc'],['DZ','Algérie'],['DE','Allemagne'],['GB','Royaume-Uni'],['US','États-Unis'],['CA','Canada']].map(
                                    ([code,name]) => `<option value="${code}" ${(c.default_shipping_country||'TN')===code?'selected':''}>${name}</option>`
                                ).join('')}
                            </select>
                        </div>
                        <button type="submit" class="settings-btn">${t('btn_save_address')}</button>
                    </form>
                </div>

                <!-- Password -->
                <div class="section">
                    <div class="section-title">${t('change_password')}</div>
                    <form id="form-password" onsubmit="changePassword(event)">
                        <div style="margin-bottom:16px;">
                            <label class="settings-label">${t('label_current_pwd')}</label>
                            <input class="settings-input" type="password" id="p-current" placeholder="••••••••" autocomplete="current-password">
                        </div>
                        <div style="margin-bottom:16px;">
                            <label class="settings-label">${t('label_new_pwd')}</label>
                            <input class="settings-input" type="password" id="p-new" placeholder="••••••••" autocomplete="new-password">
                        </div>
                        <div style="margin-bottom:16px;">
                            <label class="settings-label">${t('label_confirm_pwd')}</label>
                            <input class="settings-input" type="password" id="p-confirm" placeholder="••••••••" autocomplete="new-password">
                        </div>
                        <button type="submit" class="settings-btn">${t('btn_change_pwd')}</button>
                    </form>
                </div>

                <!-- Preferences -->
                <div class="section">
                    <div class="section-title">${t('preferences')}</div>
                    <form id="form-prefs" onsubmit="savePrefs(event)">
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
                            <div>
                                <label class="settings-label">${t('label_currency')}</label>
                                <select class="settings-input" id="pref-currency">
                                    <option value="TND" ${(c.preferred_currency||'TND')==='TND'?'selected':''}>TND (Dinar Tunisien)</option>
                                    <option value="EUR" ${(c.preferred_currency||'')==='EUR'?'selected':''}>EUR (Euro)</option>
                                </select>
                            </div>
                            <div>
                                <label class="settings-label">${t('label_language')}</label>
                                <select class="settings-input" id="pref-lang">
                                    <option value="fr" ${(c.preferred_language||'fr')==='fr'?'selected':''}>Français</option>
                                    <option value="en" ${(c.preferred_language||'')==='en'?'selected':''}>English</option>
                                    <option value="ar" ${(c.preferred_language||'')==='ar'?'selected':''}>العربية</option>
                                </select>
                            </div>
                        </div>
                        <div style="margin-bottom:16px;">
                            <label class="settings-label" style="display:flex;align-items:center;gap:10px;cursor:pointer;">
                                <input type="checkbox" id="pref-newsletter" ${c.newsletter_subscribed?'checked':''} style="width:18px;height:18px;cursor:pointer;">
                                ${t('label_newsletter')}
                            </label>
                        </div>
                        <button type="submit" class="settings-btn">${t('btn_save_prefs')}</button>
                    </form>
                </div>

                <div class="dashboard-actions">
                    <a href="/shop/account/" class="btn-action btn-shop">${t('back_dashboard')}</a>
                    <button class="btn-action btn-logout" onclick="logout()">${t('btn_logout')}</button>
                </div>
            `;
        }

        function showToast(msg, ok = true) {
            const t = document.getElementById('settings-toast');
            if (!t) return;
            t.textContent = msg;
            t.style.display = 'block';
            t.style.background = ok ? '#d4edda' : '#f8d7da';
            t.style.color = ok ? '#155724' : '#721c24';
            t.style.border = ok ? '1px solid #c3e6cb' : '1px solid #f5c6cb';
            t.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            setTimeout(() => { t.style.display = 'none'; }, 4000);
        }

        async function saveProfile(e) {
            e.preventDefault();
            const body = {
                first_name: document.getElementById('s-first-name').value.trim(),
                last_name:  document.getElementById('s-last-name').value.trim(),
                phone:      document.getElementById('s-phone')?.value.trim() || '',
            };
            const companyEl = document.getElementById('s-company');
            const taxEl     = document.getElementById('s-tax-id');
            if (companyEl) body.company_name    = companyEl.value.trim();
            if (taxEl)     body.company_tax_id  = taxEl.value.trim();

            try {
                const res = await fetch(`${API_URL}/customer/profile/`, {
                    method: 'PATCH', headers: authHeaders(), body: JSON.stringify(body)
                });
                const data = await res.json();
                if (res.ok) showToast('Informations mises à jour avec succès.');
                else showToast(data.detail || data.error || 'Erreur lors de la mise à jour.', false);
            } catch { showToast('Erreur réseau.', false); }
        }

        async function saveAddress(e) {
            e.preventDefault();
            const body = {
                default_shipping_first_name:   document.getElementById('a-first-name').value.trim(),
                default_shipping_last_name:    document.getElementById('a-last-name').value.trim(),
                default_shipping_address_1:    document.getElementById('a-address1').value.trim(),
                default_shipping_address_2:    document.getElementById('a-address2').value.trim(),
                default_shipping_city:         document.getElementById('a-city').value.trim(),
                default_shipping_postal_code:  document.getElementById('a-postal').value.trim(),
                default_shipping_country:      document.getElementById('a-country').value,
            };
            try {
                const res = await fetch(`${API_URL}/customer/profile/`, {
                    method: 'PATCH', headers: authHeaders(), body: JSON.stringify(body)
                });
                const data = await res.json();
                if (res.ok) showToast('Adresse enregistrée avec succès.');
                else showToast(data.detail || data.error || 'Erreur lors de la mise à jour.', false);
            } catch { showToast('Erreur réseau.', false); }
        }

        async function changePassword(e) {
            e.preventDefault();
            const current = document.getElementById('p-current').value;
            const newPwd  = document.getElementById('p-new').value;
            const confirm = document.getElementById('p-confirm').value;
            if (newPwd !== confirm) { showToast('Les mots de passe ne correspondent pas.', false); return; }
            if (newPwd.length < 8)  { showToast('Le mot de passe doit contenir au moins 8 caractères.', false); return; }
            try {
                const res = await fetch(`${API_URL}/auth/change-password/`, {
                    method: 'POST', headers: authHeaders(),
                    body: JSON.stringify({ current_password: current, new_password: newPwd, confirm_password: confirm })
                });
                const data = await res.json();
                if (res.ok) {
                    showToast('Mot de passe modifié. Veuillez vous reconnecter.');
                    document.getElementById('form-password').reset();
                    setTimeout(() => { clearTokens(); window.location.href = '/shop/login/'; }, 2500);
                } else {
                    showToast(data.error || 'Erreur lors du changement.', false);
                }
            } catch { showToast('Erreur réseau.', false); }
        }

        async function savePrefs(e) {
            e.preventDefault();
            const body = {
                preferred_currency:    document.getElementById('pref-currency').value,
                preferred_language:    document.getElementById('pref-lang').value,
                newsletter_subscribed: document.getElementById('pref-newsletter').checked,
            };
            try {
                const res = await fetch(`${API_URL}/customer/profile/`, {
                    method: 'PATCH', headers: authHeaders(), body: JSON.stringify(body)
                });
                const data = await res.json();
                if (res.ok) showToast('Préférences enregistrées.');
                else showToast(data.detail || data.error || 'Erreur.', false);
            } catch { showToast('Erreur réseau.', false); }
        }

        renderLangSwitcher();
    </script>
</body>
</html>
