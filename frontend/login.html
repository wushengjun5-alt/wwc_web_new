<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Wallah We Can</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --wwc-primary: #e04403;
            --wwc-secondary: #1c345e;
            --wwc-dark: #191919;
            --wwc-text: #404040;
            --wwc-text-light: #888888;
            --wwc-bg: #ffffff;
            --wwc-bg-light: #f5f5f5;
            --wwc-border: #ececec;
            --wwc-success: #28a745;
            --wwc-error: #dc3545;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans', sans-serif; color: var(--wwc-text); background: var(--wwc-bg-light); }

        .header { background: #1c345e; padding: 0; height: 80px; }
        .header-container { max-width: 1200px; margin: 0 auto; padding: 0 24px; height: 80px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
        .logo { display: flex; align-items: center; text-decoration: none; flex-shrink: 0; }
        .logo img { height: 48px; width: auto; display: block; }
        .back-link { color: rgba(255,255,255,0.85); text-decoration: none; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
        .back-link:hover { color: white; }

        .main { max-width: 480px; margin: 60px auto; padding: 0 20px; }

        .auth-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .tab-bar {
            display: flex;
            border-bottom: 1px solid var(--wwc-border);
        }
        .tab-btn {
            flex: 1;
            padding: 16px;
            background: none;
            border: none;
            font-size: 15px;
            font-weight: 600;
            color: var(--wwc-text-light);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }
        .tab-btn.active {
            color: #e04403;
            border-bottom-color: #e04403;
        }

        .tab-content { padding: 30px; display: none; }
        .tab-content.active { display: block; }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px 14px;
            border: 1px solid var(--wwc-border);
            border-radius: 8px; font-size: 15px;
            font-family: inherit; transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none; border-color: #e04403;
            box-shadow: 0 0 0 3px rgba(224,68,3,0.08);
        }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .btn-primary {
            width: 100%; padding: 14px 36px;
            background: #e04403; color: white;
            border: none; border-radius: 30px;
            font-size: 14px; font-weight: 700;
            text-transform: uppercase;
            cursor: pointer; transition: background 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary:hover { background: #1c345e; }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }

        .forgot-link { text-align: right; margin-bottom: 16px; }
        .forgot-link a { font-size: 13px; color: var(--wwc-text-light); text-decoration: none; }
        .forgot-link a:hover { color: #e04403; }

        .switch-msg { text-align: center; margin-top: 20px; font-size: 14px; color: var(--wwc-text-light); }
        .switch-msg a { color: #e04403; font-weight: 600; cursor: pointer; text-decoration: none; }

        .alert {
            padding: 12px 16px; border-radius: 8px;
            margin-bottom: 18px; font-size: 14px; display: none;
        }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error   { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .business-field { display: none; }

        .spinner-sm {
            width: 16px; height: 16px;
            border: 2px solid white; border-top-color: transparent;
            border-radius: 50%; animation: spin 0.8s linear infinite; display: none;
        }
        .loading .spinner-sm { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Forgot password inline section */
        .forgot-section { display: none; padding: 30px; }
        .forgot-section.active { display: block; }
        .back-to-login { background: none; border: none; color: #e04403; font-weight: 600; cursor: pointer; margin-bottom: 20px; font-size: 14px; }

        .footer { background: #191919; color: white; padding: 20px 0; margin-top: 60px; text-align: center; font-size: 14px; opacity: 0.9; }

        /* Language dropdown */
        .hdr-dropdown { position: relative; }
        .hdr-dropdown-btn { display: flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); color: white; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .hdr-dropdown-btn:hover { background: rgba(255,255,255,0.22); }
        .hdr-dropdown-menu { display: none; position: absolute; top: calc(100% + 6px); right: 0; background: white; border: 1px solid #ececec; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); overflow: hidden; min-width: 120px; z-index: 300; }
        .hdr-dropdown-menu.open { display: block; }
        .hdr-dropdown-item { display: block; width: 100%; padding: 9px 16px; background: none; border: none; text-align: left; font-size: 13px; font-weight: 600; color: #404040; cursor: pointer; white-space: nowrap; transition: background 0.15s, color 0.15s; }
        .hdr-dropdown-item:hover { background: #f5f5f5; color: #e04403; }
        .hdr-dropdown-item.active { color: #e04403; background: rgba(224,68,3,0.07); }

        /* RTL support */
        [dir=rtl] .forgot-link { text-align: left; }
        [dir=rtl] .form-group input, [dir=rtl] .form-group select, [dir=rtl] .form-group textarea { text-align: right; direction: rtl; }
        [dir=rtl] .hdr-dropdown-menu { right: auto; left: 0; }
        [dir=rtl] .hdr-dropdown-item { text-align: right; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <a href="/shop/" class="logo">
                <img src="https://wallahwecan.org/wp-content/uploads/2022/05/LOGO-WWC-.png" alt="Wallah We Can">
            </a>
            <div style="display:flex;align-items:center;gap:12px;">
                <a href="/shop/" class="back-link" id="back-link-text" data-i18n="back_to_shop">← Retour à la boutique</a>
                <div class="hdr-dropdown" id="lang-dropdown">
                    <button class="hdr-dropdown-btn" onclick="toggleDropdown('lang-dropdown')" id="lang-label">FR <svg viewBox="0 0 10 6" style="width:8px;fill:white"><path d="M0 0l5 6 5-6z"/></svg></button>
                    <div class="hdr-dropdown-menu" id="lang-menu">
                        <button class="hdr-dropdown-item" data-lang="fr" onclick="switchLang('fr')">🇫🇷 Français</button>
                        <button class="hdr-dropdown-item" data-lang="en" onclick="switchLang('en')">🇬🇧 English</button>
                        <button class="hdr-dropdown-item" data-lang="ar" onclick="switchLang('ar')">🇹🇳 العربية</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="auth-card">

            <!-- Tabs -->
            <div class="tab-bar" id="tab-bar">
                <button class="tab-btn active" onclick="switchTab('login')" data-i18n="login">Se connecter</button>
                <button class="tab-btn" onclick="switchTab('register')" data-i18n="register">Créer un compte</button>
            </div>

            <!-- Login Tab -->
            <div class="tab-content active" id="tab-login">
                <div class="alert alert-error" id="login-error"></div>
                <div class="alert alert-success" id="login-success"></div>

                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label data-i18n="email">Adresse e-mail</label>
                        <input type="email" name="email" required autocomplete="email" placeholder="vous@exemple.com">
                    </div>
                    <div class="form-group">
                        <label data-i18n="password">Mot de passe</label>
                        <input type="password" name="password" required autocomplete="current-password">
                    </div>
                    <div class="forgot-link">
                        <a href="#" onclick="showForgot(); return false;" data-i18n="forgot_password">Mot de passe oublié ?</a>
                    </div>
                    <button type="submit" class="btn-primary" id="login-btn">
                        <span class="spinner-sm"></span>
                        <span data-i18n="login_btn">Se connecter</span>
                    </button>
                </form>

                <p class="switch-msg">
                    <span data-i18n="no_account">Pas encore de compte ?</span> <a onclick="switchTab('register')" data-i18n="register">Créer un compte</a>
                </p>
            </div>

            <!-- Register Tab -->
            <div class="tab-content" id="tab-register">
                <div class="alert alert-error" id="register-error"></div>
                <div class="alert alert-success" id="register-success"></div>

                <form id="register-form" onsubmit="handleRegister(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label data-i18n="first_name">Prénom *</label>
                            <input type="text" name="first_name" required autocomplete="given-name">
                        </div>
                        <div class="form-group">
                            <label data-i18n="last_name">Nom</label>
                            <input type="text" name="last_name" autocomplete="family-name">
                        </div>
                    </div>
                    <div class="form-group">
                        <label data-i18n="email">Adresse e-mail *</label>
                        <input type="email" name="email" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label data-i18n="password">Mot de passe *</label>
                        <input type="password" name="password" required autocomplete="new-password" minlength="8">
                    </div>
                    <div class="form-group">
                        <label data-i18n="confirm_password">Confirmer le mot de passe *</label>
                        <input type="password" name="password_confirm" required autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label data-i18n="account_type">Type de compte</label>
                        <select name="customer_type" onchange="toggleBusinessField(this)">
                            <option value="individual">Particulier</option>
                            <option value="company">Professionnel (B2B)</option>
                        </select>
                    </div>
                    <div class="form-group business-field" id="company-field">
                        <label data-i18n="company_name">Nom de la société</label>
                        <input type="text" name="company_name" autocomplete="organization">
                    </div>
                    <button type="submit" class="btn-primary" id="register-btn">
                        <span class="spinner-sm"></span>
                        <span data-i18n="create_account">Créer mon compte</span>
                    </button>
                </form>

                <p class="switch-msg">
                    <span data-i18n="already_account">Déjà un compte ?</span> <a onclick="switchTab('login')" data-i18n="login">Se connecter</a>
                </p>
            </div>

            <!-- Forgot Password Section (replaces login tab content) -->
            <div class="forgot-section" id="forgot-section">
                <button class="back-to-login" onclick="hideForgot()" data-i18n="back_to_login">← Retour à la connexion</button>
                <h3 style="margin-bottom:8px; color: #1c345e;" data-i18n="forgot_title">Mot de passe oublié</h3>
                <p style="font-size:14px; color: var(--wwc-text-light); margin-bottom:20px;" data-i18n="forgot_desc">
                    Entrez votre e-mail et nous vous enverrons un lien de réinitialisation.
                </p>
                <div class="alert alert-error" id="forgot-error"></div>
                <div class="alert alert-success" id="forgot-success"></div>
                <form id="forgot-form" onsubmit="handleForgot(event)">
                    <div class="form-group">
                        <label data-i18n="email">Adresse e-mail</label>
                        <input type="email" name="email" required placeholder="vous@exemple.com">
                    </div>
                    <button type="submit" class="btn-primary" id="forgot-btn">
                        <span class="spinner-sm"></span>
                        <span data-i18n="send_link">Envoyer le lien</span>
                    </button>
                </form>
            </div>

        </div>
    </main>

    <footer class="footer">© 2026 Wallah We Can</footer>

    <script>
        // ─── i18n ────────────────────────────────────────────────────
        const LANGS = ['fr', 'en', 'ar'];
        function getLang() {
            const v = localStorage.getItem('wwc_lang');
            return LANGS.includes(v) ? v : 'fr';
        }
        const T = {
            fr: {
                login: 'Se connecter', register: 'Créer un compte', email: 'Adresse e-mail',
                password: 'Mot de passe', forgot_password: 'Mot de passe oublié ?',
                login_btn: 'Se connecter', no_account: 'Pas encore de compte ?',
                confirm_password: 'Confirmer le mot de passe *', account_type: 'Type de compte',
                company_name: 'Nom de la société', create_account: 'Créer mon compte',
                already_account: 'Déjà un compte ?', back_to_login: '← Retour à la connexion',
                forgot_title: 'Mot de passe oublié', send_link: 'Envoyer le lien',
                forgot_desc: 'Entrez votre e-mail et nous vous enverrons un lien de réinitialisation.',
                back_to_shop: '← Retour à la boutique', first_name: 'Prénom *', last_name: 'Nom',
                login_success: 'Connexion réussie ! Redirection…',
                register_success: 'Compte créé ! Redirection…',
            },
            en: {
                login: 'Log in', register: 'Create account', email: 'Email address',
                password: 'Password', forgot_password: 'Forgot password?',
                login_btn: 'Log in', no_account: 'No account yet?',
                confirm_password: 'Confirm password *', account_type: 'Account type',
                company_name: 'Company name', create_account: 'Create my account',
                already_account: 'Already have an account?', back_to_login: '← Back to login',
                forgot_title: 'Forgot password', send_link: 'Send link',
                forgot_desc: 'Enter your email and we will send you a reset link.',
                back_to_shop: '← Back to shop', first_name: 'First name *', last_name: 'Last name',
                login_success: 'Login successful! Redirecting…',
                register_success: 'Account created! Redirecting…',
            },
            ar: {
                login: 'تسجيل الدخول', register: 'إنشاء حساب', email: 'البريد الإلكتروني',
                password: 'كلمة المرور', forgot_password: 'نسيت كلمة المرور؟',
                login_btn: 'تسجيل الدخول', no_account: 'ليس لديك حساب؟',
                confirm_password: 'تأكيد كلمة المرور *', account_type: 'نوع الحساب',
                company_name: 'اسم الشركة', create_account: 'إنشاء حسابي',
                already_account: 'لديك حساب بالفعل؟', back_to_login: '→ العودة إلى تسجيل الدخول',
                forgot_title: 'نسيت كلمة المرور', send_link: 'إرسال الرابط',
                forgot_desc: 'أدخل بريدك الإلكتروني وسنرسل لك رابط إعادة التعيين.',
                back_to_shop: 'العودة إلى المتجر →', first_name: 'الاسم الأول *', last_name: 'الاسم الأخير',
                login_success: 'تم تسجيل الدخول! جاري التحويل…',
                register_success: 'تم إنشاء الحساب! جاري التحويل…',
            }
        };
        function t(key) { return (T[getLang()] || T.fr)[key] || T.fr[key] || key; }
        function applyTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                el.textContent = t(key);
            });
            document.documentElement.lang = getLang();
            document.documentElement.dir = getLang() === 'ar' ? 'rtl' : 'ltr';
            // Update select options for customer_type
            const custTypeSelect = document.querySelector('select[name="customer_type"]');
            if (custTypeSelect) {
                custTypeSelect.options[0].text = getLang() === 'ar' ? 'فرد' : getLang() === 'en' ? 'Individual' : 'Particulier';
                custTypeSelect.options[1].text = getLang() === 'ar' ? 'شركة (B2B)' : getLang() === 'en' ? 'Business (B2B)' : 'Professionnel (B2B)';
            }
        }
        function renderLangSwitcher() {
            const lang = getLang();
            const labels = { fr: 'FR', en: 'EN', ar: 'ع' };
            const lbl = document.getElementById('lang-label');
            if (lbl) lbl.innerHTML = `${labels[lang]} <svg viewBox="0 0 10 6" style="width:8px;fill:white"><path d="M0 0l5 6 5-6z"/></svg>`;
            document.querySelectorAll('[data-lang]').forEach(el => {
                el.classList.toggle('active', el.dataset.lang === lang);
            });
            applyTranslations();
        }
        function switchLang(lang) {
            localStorage.setItem('wwc_lang', lang);
            document.querySelectorAll('.hdr-dropdown-menu.open').forEach(m => m.classList.remove('open'));
            renderLangSwitcher();
        }
        function toggleDropdown(id) {
            const menu = document.getElementById(id).querySelector('.hdr-dropdown-menu');
            menu.classList.toggle('open');
            document.addEventListener('click', function handler(e) {
                if (!document.getElementById(id).contains(e.target)) {
                    menu.classList.remove('open');
                    document.removeEventListener('click', handler);
                }
            });
        }
        // ─────────────────────────────────────────────────────────────

        const API_URL = '/api/v1';

        // Check if already logged in
        function getToken() { return localStorage.getItem('wwc_access_token'); }
        function setTokens(access, refresh, user) {
            localStorage.setItem('wwc_access_token', access);
            if (refresh) localStorage.setItem('wwc_refresh_token', refresh);
            if (user?.customer_type) localStorage.setItem('wwc_customer_type', user.customer_type);
            if (user?.b2b_status) localStorage.setItem('wwc_b2b_status', user.b2b_status);
        }
        function clearTokens() {
            localStorage.removeItem('wwc_access_token');
            localStorage.removeItem('wwc_refresh_token');
            localStorage.removeItem('wwc_customer_type');
            localStorage.removeItem('wwc_b2b_status');
        }

        if (getToken()) {
            const redirect = new URLSearchParams(window.location.search).get('redirect') || '/shop/';
            window.location.href = redirect;
        }

        // Check if we should open register tab
        if (new URLSearchParams(window.location.search).get('tab') === 'register') {
            switchTab('register');
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach((b, i) => {
                b.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
            });
            document.getElementById('tab-login').classList.toggle('active', tab === 'login');
            document.getElementById('tab-register').classList.toggle('active', tab === 'register');
            document.getElementById('forgot-section').classList.remove('active');
            document.getElementById('tab-bar').style.display = 'flex';
        }

        function showForgot() {
            document.getElementById('tab-bar').style.display = 'none';
            document.getElementById('tab-login').classList.remove('active');
            document.getElementById('tab-register').classList.remove('active');
            document.getElementById('forgot-section').classList.add('active');
        }

        function hideForgot() {
            document.getElementById('tab-bar').style.display = 'flex';
            document.getElementById('forgot-section').classList.remove('active');
            document.getElementById('tab-login').classList.add('active');
        }

        function toggleBusinessField(sel) {
            document.getElementById('company-field').style.display =
                sel.value === 'company' ? 'block' : 'none';
        }

        function showAlert(id, msg, type) {
            const el = document.getElementById(id);
            el.className = `alert alert-${type}`;
            el.textContent = msg;
            el.style.display = 'block';
        }

        function setLoading(btnId, loading) {
            const btn = document.getElementById(btnId);
            btn.disabled = loading;
            btn.querySelector('.spinner-sm').style.display = loading ? 'inline-block' : 'none';
        }

        function getSessionKey() {
            let key = localStorage.getItem('wwc_session_key');
            if (!key) {
                key = crypto.randomUUID();
                localStorage.setItem('wwc_session_key', key);
            }
            return key;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const form = e.target;
            document.getElementById('login-error').style.display = 'none';
            document.getElementById('login-success').style.display = 'none';
            setLoading('login-btn', true);

            try {
                const res = await fetch(`${API_URL}/auth/login/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Session-Key': getSessionKey(),
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        email: form.email.value,
                        password: form.password.value,
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || data.detail || 'Erreur de connexion');

                if (data.access) setTokens(data.access, data.refresh, data.user);
                showAlert('login-success', t('login_success'), 'success');

                setTimeout(() => {
                    const redirect = new URLSearchParams(window.location.search).get('redirect') || '/shop/';
                    window.location.href = redirect;
                }, 800);
            } catch (err) {
                showAlert('login-error', err.message, 'error');
                setLoading('login-btn', false);
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const form = e.target;
            const data = Object.fromEntries(new FormData(form));
            document.getElementById('register-error').style.display = 'none';
            document.getElementById('register-success').style.display = 'none';

            if (data.password !== data.password_confirm) {
                showAlert('register-error', 'Les mots de passe ne correspondent pas.', 'error');
                return;
            }
            setLoading('register-btn', true);

            try {
                const res = await fetch(`${API_URL}/auth/register/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Session-Key': getSessionKey(),
                    },
                    credentials: 'include',
                    body: JSON.stringify(data)
                });
                const json = await res.json();
                if (!res.ok) {
                    const msg = json.error || json.email?.[0] || json.password?.[0] || 'Erreur lors de l\'inscription';
                    throw new Error(msg);
                }

                if (json.access) setTokens(json.access, json.refresh, json.user);
                showAlert('register-success', t('register_success'), 'success');

                setTimeout(() => {
                    window.location.href = '/shop/';
                }, 800);
            } catch (err) {
                showAlert('register-error', err.message, 'error');
                setLoading('register-btn', false);
            }
        }

        async function handleForgot(e) {
            e.preventDefault();
            const form = e.target;
            document.getElementById('forgot-error').style.display = 'none';
            document.getElementById('forgot-success').style.display = 'none';
            setLoading('forgot-btn', true);

            try {
                const res = await fetch(`${API_URL}/auth/password-reset/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: form.email.value })
                });
                const data = await res.json();
                showAlert('forgot-success', data.message || 'Si cet email existe, un lien a été envoyé.', 'success');
                form.reset();
            } catch (err) {
                showAlert('forgot-error', err.message, 'error');
            } finally {
                setLoading('forgot-btn', false);
            }
        }

        renderLangSwitcher();
    </script>
</body>
</html>
