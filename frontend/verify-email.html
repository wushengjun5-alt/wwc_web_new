<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation d'email - Wallah We Can</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --wwc-primary: #e04403;
            --wwc-secondary: #1c345e;
            --wwc-dark: #191919;
            --wwc-text: #404040;
            --wwc-text-light: #888888;
            --wwc-bg: #ffffff;
            --wwc-bg-light: #f5f5f5;
            --wwc-border: #ececec;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans', sans-serif; color: var(--wwc-text); background: var(--wwc-bg-light); }
        .header { background: #1c345e; padding: 0 24px; height: 80px; display: flex; align-items: center; }
        .logo { display: flex; align-items: center; text-decoration: none; flex-shrink: 0; }
        .logo img { height: 48px; width: auto; display: block; }
        .main { max-width: 440px; margin: 60px auto; padding: 0 20px; }
        .card { background: white; border-radius: 16px; box-shadow: 0 2px 16px rgba(0,0,0,0.08); padding: 32px; }
        h2 { font-family: 'Montserrat', sans-serif; color: var(--wwc-secondary); margin-bottom: 8px; }
        p.desc { color: var(--wwc-text-light); font-size: 14px; margin-bottom: 24px; }
        .btn { display: inline-block; padding: 14px 36px; background: #e04403; color: white; border: none; border-radius: 30px; font-size: 14px; font-weight: 700; text-transform: uppercase; cursor: pointer; text-decoration: none; }
        .btn:hover { background: #1c345e; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 18px; font-size: 14px; display: none; }
        .alert-success { background: #d4edda; color: #155724; }
        .alert-error   { background: #f8d7da; color: #721c24; }
        .icon { font-size: 48px; text-align: center; margin-bottom: 16px; }
        .state-content { text-align: center; }
        .state-content h2 { margin-bottom: 12px; }
        .state-content p { color: var(--wwc-text-light); font-size: 14px; margin-bottom: 24px; line-height: 1.6; }
        .loading-spinner { text-align: center; padding: 40px 0; color: var(--wwc-text-light); }
        .alert-msg { padding: 12px 16px; border-radius: 8px; margin-bottom: 18px; font-size: 14px; }
        .alert-msg.success { background: #d4edda; color: #155724; }
        .alert-msg.error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <header class="header">
        <a href="/shop/" class="logo">
            <img src="https://wallahwecan.org/wp-content/uploads/2022/05/LOGO-WWC-.png" alt="Wallah We Can">
        </a>
    </header>
    <main class="main">
        <div class="card" id="card-content">
            <div class="loading-spinner">Vérification en cours…</div>
        </div>
    </main>
    <script>
        const API_URL = '/api/v1';
        const params = new URLSearchParams(window.location.search);
        const uid    = params.get('uid');
        const token  = params.get('token');
        const card   = document.getElementById('card-content');

        async function verifyEmail() {
            if (!uid || !token) {
                showError();
                return;
            }

            try {
                const res  = await fetch(`${API_URL}/auth/verify-email/?uid=${encodeURIComponent(uid)}&token=${encodeURIComponent(token)}`);
                const data = await res.json();

                if (res.ok) {
                    showSuccess();
                } else {
                    showError(data.error);
                }
            } catch (ex) {
                showError();
            }
        }

        function showSuccess() {
            card.innerHTML = `
                <div class="state-content">
                    <div class="icon">&#10003;</div>
                    <h2>Email confirmé !</h2>
                    <p>Votre email a été confirmé !<br>Vous pouvez maintenant profiter de toutes les fonctionnalités de la boutique.</p>
                    <a href="/shop/" class="btn">Aller faire des courses</a>
                </div>`;
        }

        function showError(message) {
            const msg = message || 'Ce lien de vérification est invalide ou a expiré.';
            card.innerHTML = `
                <div class="state-content">
                    <div class="icon" style="color:#e04403;">&#x26A0;</div>
                    <h2>Lien expiré</h2>
                    <p>${msg}<br>Vous pouvez demander un nouvel email de vérification.</p>
                    <div id="resend-alert"></div>
                    <button class="btn" id="resend-btn" onclick="resendEmail()">Renvoyer l'email</button>
                </div>`;
        }

        async function resendEmail() {
            const btn   = document.getElementById('resend-btn');
            const alert = document.getElementById('resend-alert');
            const jwt   = localStorage.getItem('wwc_access_token') || localStorage.getItem('access_token');

            if (!jwt) {
                alert.className = 'alert-msg error';
                alert.textContent = 'Vous devez être connecté pour renvoyer l\'email de vérification.';
                alert.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Envoi…';
            alert.style.display = 'none';

            try {
                const res  = await fetch(`${API_URL}/auth/verify-email/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${jwt}`
                    }
                });
                const data = await res.json();

                if (res.ok) {
                    alert.className = 'alert-msg success';
                    alert.textContent = 'Email de vérification envoyé ! Vérifiez votre boîte de réception.';
                } else {
                    alert.className = 'alert-msg error';
                    alert.textContent = data.error || 'Une erreur s\'est produite. Veuillez réessayer.';
                }
            } catch (ex) {
                alert.className = 'alert-msg error';
                alert.textContent = 'Une erreur s\'est produite. Veuillez réessayer.';
            }

            alert.style.display = 'block';
            btn.disabled = false;
            btn.textContent = "Renvoyer l'email";
        }

        verifyEmail();
    </script>
</body>
</html>
