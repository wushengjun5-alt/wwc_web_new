<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finaliser la commande - Wallah We Can</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --wwc-primary: #e04403;
            --wwc-secondary: #1c345e;
            --wwc-dark: #191919;
            --wwc-text: #404040;
            --wwc-text-light: #888888;
            --wwc-bg: #ffffff;
            --wwc-bg-light: #f5f5f5;
            --wwc-border: #ececec;
            --wwc-success: #28a745;
            --wwc-error: #dc3545;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans', sans-serif;
            color: var(--wwc-text);
            background: var(--wwc-bg-light);
            line-height: 1.6;
        }

        /* Header */
        .header {
            background: #ffffff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            padding: 0;
            height: 80px;
            position: sticky;
            top: 0;
            z-index: 200;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .logo {
            display: flex;
            align-items: center;
            text-decoration: none;
            flex-shrink: 0;
        }

        .logo img {
            height: 48px;
            width: auto;
            display: block;
        }

        .back-link {
            color: #191919;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-link:hover {
            color: #e04403;
        }

        /* Main Content */
        .main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 28px;
            color: var(--wwc-secondary);
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Checkout Layout */
        .checkout-layout {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 40px;
        }

        /* Form Sections */
        .checkout-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .checkout-section h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 18px;
            color: var(--wwc-secondary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
            color: var(--wwc-text);
        }

        .form-group label .required {
            color: var(--wwc-error);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--wwc-border);
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #e04403;
            box-shadow: 0 0 0 3px rgba(224, 68, 3, 0.1);
        }

        .form-group input.error,
        .form-group select.error {
            border-color: var(--wwc-error);
        }

        .form-group .error-message {
            color: var(--wwc-error);
            font-size: 12px;
            margin-top: 5px;
        }

        /* Payment Options */
        .payment-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .payment-option {
            display: flex;
            align-items: center;
            padding: 16px 18px;
            border: 2px solid var(--wwc-border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .payment-option:hover {
            border-color: #e04403;
            background: rgba(224, 68, 3, 0.02);
        }

        .payment-option.selected {
            border-color: #e04403;
            background: rgba(224, 68, 3, 0.05);
        }

        .payment-option input[type="radio"] {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            accent-color: #e04403;
        }

        .payment-label {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .payment-icon {
            font-size: 24px;
        }

        .payment-info {
            flex: 1;
        }

        .payment-info strong {
            display: block;
            margin-bottom: 2px;
        }

        .payment-info small {
            color: var(--wwc-text-light);
            font-size: 13px;
        }

        /* Order Summary */
        .order-summary {
            position: sticky;
            top: 20px;
        }

        .summary-box {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .summary-box h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 18px;
            color: var(--wwc-secondary);
            margin-bottom: 20px;
        }

        .summary-items {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .summary-item {
            display: flex;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--wwc-border);
        }

        .summary-item:last-child {
            border-bottom: none;
        }

        .summary-item-image {
            width: 60px;
            height: 60px;
            background: var(--wwc-bg-light);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .summary-item-details {
            flex: 1;
        }

        .summary-item-name {
            font-weight: 500;
            margin-bottom: 4px;
        }

        .summary-item-qty {
            color: var(--wwc-text-light);
            font-size: 13px;
        }

        .summary-item-price {
            font-weight: 600;
            color: #e04403;
        }

        .summary-totals {
            border-top: 1px solid var(--wwc-border);
            padding-top: 15px;
            margin-top: 15px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
        }

        .summary-row.total {
            font-size: 20px;
            font-weight: 700;
            color: var(--wwc-secondary);
            padding-top: 15px;
            margin-top: 10px;
            border-top: 2px solid var(--wwc-border);
        }

        .impact-box {
            background: var(--wwc-bg-light);
            padding: 18px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 4px solid #e04403;
        }

        .impact-box strong {
            display: block;
            margin-bottom: 8px;
        }

        .btn-pay {
            width: 100%;
            padding: 14px 36px;
            background: #e04403;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-pay:hover:not(:disabled) {
            background: #1c345e;
            transform: translateY(-2px);
        }

        .btn-pay:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-pay .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .btn-pay.loading .spinner {
            display: inline-block;
        }

        .btn-pay.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .secure-notice {
            text-align: center;
            margin-top: 15px;
            color: var(--wwc-text-light);
            font-size: 13px;
        }

        .secure-notice span {
            color: var(--wwc-success);
        }

        /* Empty Cart */
        .empty-cart {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 12px;
        }

        .empty-cart-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .empty-cart h2 {
            margin-bottom: 15px;
            color: var(--wwc-secondary);
        }

        .empty-cart a {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 36px;
            background: #e04403;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .empty-cart a:hover {
            background: #1c345e;
        }

        /* Loading */
        .loading-page {
            text-align: center;
            padding: 60px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--wwc-border);
            border-top-color: var(--wwc-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        /* Notification */
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 25px;
            background: var(--wwc-text);
            color: white;
            border-radius: 8px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }

        .notification.show {
            transform: translateY(0);
            opacity: 1;
        }

        .notification.success {
            background: var(--wwc-success);
        }

        .notification.error {
            background: var(--wwc-error);
        }

        /* Footer */
        .footer {
            background: #191919;
            color: white;
            padding: 30px 0;
            margin-top: 60px;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            text-align: center;
        }

        /* Address option tiles */
        .addr-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
        .addr-tile {
            display: flex; align-items: flex-start; gap: 14px;
            padding: 14px 16px; border: 2px solid var(--wwc-border); border-radius: 12px;
            cursor: pointer; transition: all 0.2s; background: white;
        }
        .addr-tile:hover { border-color: #e04403; }
        .addr-tile.selected { border-color: #e04403; background: rgba(224,68,3,0.04); }
        .addr-tile input[type="radio"] { width: 18px; height: 18px; margin-top: 2px; accent-color: #e04403; flex-shrink: 0; }
        .addr-tile-body { flex: 1; }
        .addr-tile-title { font-weight: 700; font-size: 14px; color: var(--wwc-secondary); margin-bottom: 2px; }
        .addr-tile-lines { font-size: 13px; color: #555; line-height: 1.7; }
        .addr-tile-new-label { font-weight: 700; font-size: 14px; color: var(--wwc-secondary); }
        .addr-tile-new-sub { font-size: 13px; color: var(--wwc-text-light); }
        .addr-form-expand { margin-top: 4px; padding-top: 16px; border-top: 1px solid var(--wwc-border); }

        /* Responsive */
        @media (max-width: 900px) {
            .checkout-layout {
                grid-template-columns: 1fr;
            }

            .order-summary {
                position: static;
                order: -1;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }

        /* Language dropdown */
        .hdr-dropdown { position: relative; }
        .hdr-dropdown-btn { display: flex; align-items: center; gap: 5px; background: rgba(28,52,94,0.1); border: 1px solid rgba(28,52,94,0.25); color: #191919; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .hdr-dropdown-btn:hover { background: rgba(28,52,94,0.18); }
        .hdr-dropdown-menu { display: none; position: absolute; top: calc(100% + 6px); right: 0; background: white; border: 1px solid #ececec; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); overflow: hidden; min-width: 120px; z-index: 300; }
        .hdr-dropdown-menu.open { display: block; }
        .hdr-dropdown-item { display: block; width: 100%; padding: 9px 16px; background: none; border: none; text-align: left; font-size: 13px; font-weight: 600; color: #404040; cursor: pointer; white-space: nowrap; transition: background 0.15s, color 0.15s; }
        .hdr-dropdown-item:hover { background: #f5f5f5; color: #e04403; }
        .hdr-dropdown-item.active { color: #e04403; background: rgba(224,68,3,0.07); }

        /* RTL support */
        [dir=rtl] .form-group input, [dir=rtl] .form-group select, [dir=rtl] .form-group textarea { text-align: right; direction: rtl; }
        [dir=rtl] .hdr-dropdown-menu { right: auto; left: 0; }
        [dir=rtl] .hdr-dropdown-item { text-align: right; }
    </style>
</head>

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                el.textContent = t(key);
            });
            document.documentElement.lang = getLang();
            document.documentElement.dir = getLang() === 'ar' ? 'rtl' : 'ltr';
        }
        function renderLangSwitcher() {
            const lang = getLang();
            const labels = { fr: 'FR', en: 'EN', ar: 'ع' };
            const lbl = document.getElementById('lang-label');
            if (lbl) lbl.innerHTML = `${labels[lang]} <svg viewBox="0 0 10 6" style="width:8px;fill:#191919"><path d="M0 0l5 6 5-6z"/></svg>`;
            document.querySelectorAll('[data-lang]').forEach(el => {
                el.classList.toggle('active', el.dataset.lang === lang);
            });
            applyTranslations();
        }
        function switchLang(lang) {
            localStorage.setItem('wwc_lang', lang);
            document.querySelectorAll('.hdr-dropdown-menu.open').forEach(m => m.classList.remove('open'));
            renderLangSwitcher();
        }
        function toggleDropdown(id) {
            const menu = document.getElementById(id).querySelector('.hdr-dropdown-menu');
            menu.classList.toggle('open');
            document.addEventListener('click', function handler(e) {
                if (!document.getElementById(id).contains(e.target)) {
                    menu.classList.remove('open');
                    document.removeEventListener('click', handler);
                }
            });
        }
        // ─────────────────────────────────────────────────────────────

        // API Configuration
        const API_URL = '/api/v1';

        // Stable session key for guest cart (shared with index.html via localStorage)
        function getSessionKey() {
            let key = localStorage.getItem('wwc_session_key');
            if (!key) {
                key = crypto.randomUUID();
                localStorage.setItem('wwc_session_key', key);
            }
            return key;
        }

        function getCurrentCurrency() { return localStorage.getItem('wwc_currency') || 'TND'; }
        function getCurrencySymbol() { return getCurrentCurrency() === 'EUR' ? '€' : 'DT'; }
        function getGiftFee() { return getCurrentCurrency() === 'EUR' ? 2.00 : 5.00; }

        function escHtml(str) {
            return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function apiHeaders(extra) {
            const h = { 'Content-Type': 'application/json', 'X-Session-Key': getSessionKey() };
            const token = localStorage.getItem('wwc_access_token');
            if (token) h['Authorization'] = `Bearer ${token}`;
            return Object.assign(h, extra);
        }

        let cart = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadShippingCountries();
            loadCart();
        });

        // Load active shipping countries from API and populate all country selects
        async function loadShippingCountries() {
            try {
                const res = await fetch(`${API_URL}/shipping-rates/?is_active=true&page_size=100`);
                if (!res.ok) return;
                const data = await res.json();
                const rates = data.results || [];
                if (!rates.length) return;

                const optionsHtml = rates.map(r => {
                    const selected = r.country_code === 'TN' ? ' selected' : '';
                    return `<option value="${r.country_code}"${selected}>${r.country_name}</option>`;
                }).join('');

                // Update all three country selects
                document.querySelectorAll('select[name="shipping_country"], #shipping_country, #billing_country').forEach(sel => {
                    const current = sel.value;
                    sel.innerHTML = optionsHtml;
                    // Restore previously selected value if it exists
                    if (current && sel.querySelector(`option[value="${current}"]`)) {
                        sel.value = current;
                    }
                });
            } catch (err) {
                // Silently fail — hardcoded options remain as fallback
                console.warn('Could not load shipping countries from API:', err.message);
            }
        }

        // Load cart
        async function loadCart() {
            let response;
            try {
                response = await fetch(`${API_URL}/cart/`, {
                    headers: apiHeaders()
                });
                cart = await response.json();
            } catch (error) {
                console.error('Error loading cart:', error);
                document.getElementById('main-content').innerHTML = `
                    <div class="empty-cart">
                        <div class="empty-cart-icon">⚠️</div>
                        <h2>${t('err_connection')}</h2>
                        <p>${t('err_connection_sub')}</p>
                        <a href="/shop/">${t('back_to_shop')}</a>
                    </div>
                `;
                return;
            }

            if (!cart.items || cart.items.length === 0) {
                renderEmptyCart();
            } else {
                renderCheckoutPage();
                // Pre-fill coupon from cart page
                const urlCoupon = new URLSearchParams(window.location.search).get('coupon');
                if (urlCoupon) {
                    const input = document.getElementById('coupon-input');
                    if (input) { input.value = urlCoupon; applyCoupon(); }
                }
                // Pre-fill address from profile if logged in
                const token = localStorage.getItem('wwc_access_token');
                if (token) prefillFromProfile(token);
            }
        }

        let _profile = null;        // cached profile
        let _usingSavedAddress = false; // true = tile-saved is selected

        const COUNTRY_NAMES = {TN:'Tunisie',FR:'France',BE:'Belgique',CH:'Suisse',MA:'Maroc',DZ:'Algérie',DE:'Allemagne',GB:'Royaume-Uni',US:'États-Unis',CA:'Canada'};

        async function prefillFromProfile(token) {
            try {
                const res = await fetch(`${API_URL}/customer/profile/`, {
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
                });
                if (!res.ok) return;
                _profile = await res.json();
                const p = _profile;

                // Always fill contact
                const emailEl = document.getElementById('email');
                const phoneEl = document.getElementById('phone');
                if (emailEl) emailEl.value = p.email || '';
                if (phoneEl) phoneEl.value = p.phone || '';

                const hasAddress = p.default_shipping_address_1 && p.default_shipping_city;

                if (hasAddress) {
                    // Show two-option tiles, hide plain form
                    const firstName = p.default_shipping_first_name || p.first_name || '';
                    const lastName  = p.default_shipping_last_name  || p.last_name  || '';

                    document.getElementById('saved-addr-name').textContent = `${firstName} ${lastName}`.trim();
                    document.getElementById('saved-addr-lines').innerHTML = [
                        p.default_shipping_address_1,
                        p.default_shipping_address_2,
                        `${p.default_shipping_postal_code || ''} ${p.default_shipping_city || ''}`.trim(),
                        COUNTRY_NAMES[p.default_shipping_country] || p.default_shipping_country || '',
                    ].filter(Boolean).join('<br>');

                    document.getElementById('shipping-addr-tiles').style.display = 'flex';
                    // Hide plain form and remove required so browser doesn't block submit
                    const plainForm = document.getElementById('shipping-form-fields');
                    plainForm.style.display = 'none';
                    plainForm.querySelectorAll('input[required], select[required]').forEach(el => el.removeAttribute('required'));

                    // Pre-fill the plain-form inputs with saved data (used when tile-saved is active)
                    _fillShippingHiddenFields(p);
                    _usingSavedAddress = true;
                } else {
                    // No saved address — plain form, offer to save
                    _fillShippingFormFields(p, /* fillName */ true);
                    document.getElementById('save-address-label').style.display = 'flex';
                }
            } catch { /* silent fail */ }
        }

        // Fill the hidden plain-form fields (tile-saved mode: form is invisible but still submitted)
        function _fillShippingHiddenFields(p) {
            const set = (id, val) => { const el = document.getElementById(id); if (el) { el.value = val || ''; el.removeAttribute('required'); } };
            set('shipping_first_name', p.default_shipping_first_name || p.first_name);
            set('shipping_last_name',  p.default_shipping_last_name  || p.last_name);
            set('shipping_address_1',  p.default_shipping_address_1);
            set('shipping_address_2',  p.default_shipping_address_2);
            set('shipping_city',       p.default_shipping_city);
            set('shipping_postal_code',p.default_shipping_postal_code);
            const countryEl = document.getElementById('shipping_country');
            if (countryEl && p.default_shipping_country) countryEl.value = p.default_shipping_country;
        }

        // Pre-fill name fields in the tile-new inline form from profile
        function _fillShippingFormFields(p, fillName) {
            if (!fillName) return;
            const newFields = document.getElementById('shipping-new-fields');
            if (!newFields) return;
            const fn = newFields.querySelector('[name="shipping_first_name"]');
            const ln = newFields.querySelector('[name="shipping_last_name"]');
            if (fn && !fn.value) fn.value = p.first_name || '';
            if (ln && !ln.value) ln.value = p.last_name || '';
        }

        function selectShipping(choice) {
            const tileSaved = document.getElementById('tile-saved');
            const tileNew   = document.getElementById('tile-new');
            const newFields = document.getElementById('shipping-new-fields');
            const plainForm = document.getElementById('shipping-form-fields');

            if (choice === 'saved') {
                tileSaved.classList.add('selected');
                tileNew.classList.remove('selected');
                newFields.style.display = 'none';
                // Restore saved address values in the plain hidden form
                if (_profile) _fillShippingHiddenFields(_profile);
                _usingSavedAddress = true;
                // Remove required from new-address inputs
                newFields.querySelectorAll('input, select').forEach(el => el.removeAttribute('required'));
            } else {
                tileSaved.classList.remove('selected');
                tileNew.classList.add('selected');
                newFields.style.display = 'block';
                _usingSavedAddress = false;
                // Clear any saved-address values from plain form so they don't conflict
                if (plainForm) plainForm.querySelectorAll('input, select').forEach(el => { if (el.name && el.name.startsWith('shipping_')) el.value = ''; });
                // Make new-address inputs required
                ['shipping_first_name','shipping_last_name','shipping_address_1','shipping_city','shipping_postal_code','shipping_country'].forEach(name => {
                    const el = newFields.querySelector(`[name="${name}"]`);
                    if (el) el.required = true;
                });
                // Pre-fill name from profile
                if (_profile) _fillShippingFormFields(_profile, true);
            }
        }

        function selectBilling(choice) {
            const tileSame = document.getElementById('tile-billing-same');
            const tileDiff = document.getElementById('tile-billing-diff');
            const billingFields = document.getElementById('billing-form-fields');

            if (choice === 'same') {
                tileSame.classList.add('selected');
                tileDiff.classList.remove('selected');
                billingFields.style.display = 'none';
                billingFields.querySelectorAll('input, select').forEach(el => el.removeAttribute('required'));
            } else {
                tileSame.classList.remove('selected');
                tileDiff.classList.add('selected');
                billingFields.style.display = 'block';
                ['billing_first_name','billing_last_name','billing_address_1','billing_city','billing_postal_code','billing_country'].forEach(name => {
                    const el = billingFields.querySelector(`[name="${name}"]`);
                    if (el) el.required = true;
                });
            }
        }

        // Order totals (set by renderCheckoutPage, used by updateTotal)
        let _subtotal = 0;
        let _shipping = 0;
        let _discountAmount = 0;
        let _appliedCoupon = '';

        function updateTotal() {
            const sym = getCurrencySymbol();
            const giftChecked = document.getElementById('gift_packaging')?.checked;
            const giftFee = giftChecked ? getGiftFee() : 0;
            const newTotal = Math.max(0, _subtotal + _shipping + giftFee - _discountAmount);
            const totalEl = document.getElementById('total-display');
            const giftRow = document.getElementById('gift-row');
            const giftFeeEl = document.getElementById('gift-fee-display');
            const discountRow = document.getElementById('discount-row');
            if (totalEl) totalEl.textContent = newTotal.toFixed(2) + ' ' + sym;
            if (giftFeeEl) giftFeeEl.textContent = giftFee.toFixed(2) + ' ' + sym;
            if (giftRow) giftRow.style.display = giftChecked ? '' : 'none';
            if (discountRow) discountRow.style.display = _discountAmount > 0 ? '' : 'none';
        }

        async function applyCoupon() {
            const code = document.getElementById('coupon-input')?.value.trim().toUpperCase();
            const msgEl = document.getElementById('coupon-msg');
            if (!code) return;

            try {
                const res = await fetch(`${API_URL}/coupons/apply/`, {
                    method: 'POST',
                    headers: apiHeaders(),
                    body: JSON.stringify({ code, subtotal: _subtotal })
                });
                const data = await res.json();
                if (!res.ok) {
                    msgEl.textContent = data.error || 'Code invalide.';
                    msgEl.style.color = 'var(--wwc-error, #dc3545)';
                    msgEl.style.display = '';
                    _discountAmount = 0;
                    _appliedCoupon = '';
                } else {
                    _discountAmount = parseFloat(data.discount_amount);
                    _appliedCoupon = data.code;
                    msgEl.textContent = `Code "${data.code}" appliqué : -${_discountAmount.toFixed(2)} ${getCurrencySymbol()}`;
                    msgEl.style.color = 'green';
                    msgEl.style.display = '';
                    const label = document.getElementById('discount-code-label');
                    const amountEl = document.getElementById('discount-amount-display');
                    if (label) label.textContent = data.code;
                    if (amountEl) amountEl.textContent = `-${_discountAmount.toFixed(2)} ${getCurrencySymbol()}`;
                }
            } catch {
                msgEl.textContent = 'Erreur lors de la vérification.';
                msgEl.style.color = 'var(--wwc-error, #dc3545)';
                msgEl.style.display = '';
            }
            updateTotal();
        }

                                            <div class="addr-tile-new-sub">${t('addr_diff_sub')}</div>
                                            <div class="addr-form-expand" id="billing-form-fields" style="display:none;">
                                                <div class="form-group">
                                                    <label for="billing_company">${t('label_company')}</label>
                                                    <input type="text" id="billing_company" name="billing_company" placeholder="Nom de l'entreprise / raison sociale">
                                                </div>
                                                <div class="form-row">
                                                    <div class="form-group">
                                                        <label for="billing_first_name">${t('label_first_name')} <span class="required">*</span></label>
                                                        <input type="text" id="billing_first_name" name="billing_first_name">
                                                    </div>
                                                    <div class="form-group">
                                                        <label for="billing_last_name">${t('label_last_name')} <span class="required">*</span></label>
                                                        <input type="text" id="billing_last_name" name="billing_last_name">
                                                    </div>
                                                </div>
                                                <div class="form-group">
                                                    <label for="billing_address_1">${t('label_address')} <span class="required">*</span></label>
                                                    <input type="text" id="billing_address_1" name="billing_address_1" placeholder="Numéro et nom de rue">
                                                </div>
                                                <div class="form-group">
                                                    <label for="billing_address_2">${t('label_address2')}</label>
                                                    <input type="text" id="billing_address_2" name="billing_address_2" placeholder="Appartement, étage, etc. (optionnel)">
                                                </div>
                                                <div class="form-row">
                                                    <div class="form-group">
                                                        <label for="billing_city">${t('label_city')} <span class="required">*</span></label>
                                                        <input type="text" id="billing_city" name="billing_city">
                                                    </div>
                                                    <div class="form-group">
                                                        <label for="billing_postal_code">${t('label_postal')} <span class="required">*</span></label>
                                                        <input type="text" id="billing_postal_code" name="billing_postal_code">
                                                    </div>
                                                </div>
                                                <div class="form-group">
                                                    <label for="billing_country">${t('label_country')} <span class="required">*</span></label>
                                                    <select id="billing_country" name="billing_country">
                                                        <option value="TN" selected>Tunisie</option>
                                                        <option value="FR">France</option>
                                                        <option value="BE">Belgique</option>
                                                        <option value="CH">Suisse</option>
                                                        <option value="MA">Maroc</option>
                                                        <option value="DZ">Algérie</option>
                                                        <option value="DE">Allemagne</option>
                                                        <option value="GB">Royaume-Uni</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                    </label>
                                </div>
                            </div>

                            <!-- Payment Method -->
                            <div class="checkout-section">
                                <h2>${t('section_payment')}</h2>
                                <div class="payment-options">
                                    <label class="payment-option selected" onclick="selectPayment(this, 'stripe')">
                                        <input type="radio" name="payment_method" value="stripe" checked>
                                        <div class="payment-label">
                                            <span class="payment-icon">💳</span>
                                            <div class="payment-info">
                                                <strong>${t('payment_card')}</strong>
                                                <small>${t('payment_card_sub')}</small>
                                            </div>
                                        </div>
                                    </label>
                                    <label class="payment-option" onclick="selectPayment(this, 'cash_on_delivery')">
                                        <input type="radio" name="payment_method" value="cash_on_delivery">
                                        <div class="payment-label">
                                            <span class="payment-icon">💵</span>
                                            <div class="payment-info">
                                                <strong>${t('payment_cod')}</strong>
                                                <small>${t('payment_cod_sub')}</small>
                                            </div>
                                        </div>
                                    </label>
                                </div>
                            </div>

                            <!-- Notes -->
                            <div class="checkout-section">
                                <h2>${t('section_notes')}</h2>
                                <div class="form-group" style="margin-bottom: 0;">
                                    <textarea id="customer_notes" name="customer_notes" rows="3" placeholder="${t('notes_placeholder')}"></textarea>
                                </div>
                            </div>

                            <!-- Gift Packaging -->
                            <div class="checkout-section">
                                <h2>${t('section_gift')}</h2>
                                <label style="display:flex; align-items:center; gap:12px; cursor:pointer; padding:14px; background:#fffbf0; border:1px solid #f0c000; border-radius:10px;">
                                    <input type="checkbox" id="gift_packaging" name="gift_packaging" onchange="updateTotal()" style="width:18px; height:18px; cursor:pointer; accent-color:#e04403;">
                                    <div>
                                        <div style="font-weight:600; font-size:15px;">${t('gift_label')}</div>
                                        <div style="font-size:13px; color:#888888; margin-top:2px;" id="gift-desc">Votre commande sera présentée dans un beau coffret cadeau (+${getGiftFee().toFixed(0)} ${getCurrencySymbol()})</div>
                                    </div>
                                </label>
                            </div>
                        </form>
                    </div>

                    <!-- Right: Summary -->
                    <div class="order-summary">
                        <div class="summary-box">
                            <h2>${t('section_summary')}</h2>

                            <div class="summary-items">
                                ${itemsHtml}
                            </div>

                            <!-- Coupon code -->
                            <div style="display:flex;gap:8px;margin-bottom:16px;">
                                <input type="text" id="coupon-input" placeholder="${t('coupon_placeholder')}"
                                    style="flex:1;padding:9px 12px;border:1px solid var(--wwc-border);border-radius:8px;font-size:14px;font-family:inherit;text-transform:uppercase;">
                                <button type="button" onclick="applyCoupon()"
                                    style="padding:9px 16px;background:var(--wwc-primary);color:white;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">${t('coupon_apply')}</button>
                            </div>
                            <div id="coupon-msg" style="font-size:13px;margin-bottom:12px;display:none;"></div>

                            <div class="summary-totals">
                                <div class="summary-row">
                                    <span>${t('subtotal')}</span>
                                    <span>${subtotal.toFixed(2)} ${getCurrencySymbol()}</span>
                                </div>
                                <div class="summary-row">
                                    <span>${t('shipping')}</span>
                                    <span>${shipping.toFixed(2)} ${getCurrencySymbol()}</span>
                                </div>
                                <div class="summary-row" id="discount-row" style="display:none;color:green;">
                                    <span>${t('discount')} (<span id="discount-code-label"></span>)</span>
                                    <span id="discount-amount-display">-0.00 ${getCurrencySymbol()}</span>
                                </div>
                                <div class="summary-row" id="gift-row" style="display:none;">
                                    <span>🎁 ${t('section_gift')}</span>
                                    <span id="gift-fee-display">${getGiftFee().toFixed(2)} ${getCurrencySymbol()}</span>
                                </div>
                                <div class="summary-row total">
                                    <span>${t('total')}</span>
                                    <span id="total-display">${total.toFixed(2)} ${getCurrencySymbol()}</span>
                                </div>
                            </div>

                            ${impactHtml}

                            <button type="submit" class="btn-pay" id="btn-pay" onclick="submitOrder(event)">
                                <span class="btn-text">${t('btn_confirm')}</span>
                                <span class="spinner"></span>
                            </button>

                            <p class="secure-notice">
                                <span>🔒</span> ${t('secure')}
                            </p>
                        </div>
                    </div>
                </div>
            `;
        }

        // Select payment method
        function selectPayment(element, method) {
            document.querySelectorAll('.payment-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            element.classList.add('selected');
            element.querySelector('input[type="radio"]').checked = true;

            // Update button text based on payment method
            const btnText = document.querySelector('.btn-pay .btn-text');
            if (method === 'stripe') {
                btnText.textContent = t('btn_pay_now');
            } else {
                btnText.textContent = t('btn_confirm');
            }
        }

        // Submit order
        async function submitOrder(event) {
            event.preventDefault();

            const form = document.getElementById('checkout-form');
            const formData = new FormData(form);
            const btnPay = document.getElementById('btn-pay');

            // Validate form
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            // Show loading
            btnPay.classList.add('loading');
            btnPay.disabled = true;

            // Resolve shipping address:
            // - tile-saved or no tiles (guest): read from plain form by ID (inside #shipping-form-fields)
            // - tile-new selected: read from inside #shipping-new-fields
            const tilesVisible = document.getElementById('shipping-addr-tiles')?.style.display !== 'none';
            const usingNew = tilesVisible && !_usingSavedAddress;

            function getShip(name) {
                if (usingNew) {
                    // Read from the expanded tile-new inline form
                    const el = document.querySelector(`#shipping-new-fields [name="${name}"]`);
                    return el ? el.value : '';
                } else {
                    // Read from plain form by id (hidden when tiles visible, visible for guests)
                    const el = document.getElementById(name);
                    return el ? el.value : '';
                }
            }

            // Billing choice: diff tile selected means different billing address
            const billingSame = !document.getElementById('tile-billing-diff')?.classList.contains('selected');

            const checkoutData = {
                email: formData.get('email'),
                phone: formData.get('phone'),
                shipping_first_name: getShip('shipping_first_name'),
                shipping_last_name:  getShip('shipping_last_name'),
                shipping_address_1:  getShip('shipping_address_1'),
                shipping_address_2:  getShip('shipping_address_2') || '',
                shipping_city:       getShip('shipping_city'),
                shipping_postal_code:getShip('shipping_postal_code'),
                shipping_country:    getShip('shipping_country') || 'TN',
                payment_method: formData.get('payment_method'),
                customer_notes: formData.get('customer_notes') || '',
                gift_packaging: document.getElementById('gift_packaging')?.checked || false,
                coupon_code: _appliedCoupon || '',
                billing_same_as_shipping: billingSame,
                billing_first_name: billingSame ? '' : (formData.get('billing_first_name') || ''),
                billing_last_name:  billingSame ? '' : (formData.get('billing_last_name')  || ''),
                billing_company:    formData.get('billing_company') || '',
                billing_address_1:  billingSame ? '' : (formData.get('billing_address_1')  || ''),
                billing_address_2:  billingSame ? '' : (formData.get('billing_address_2')  || ''),
                billing_city:       billingSame ? '' : (formData.get('billing_city')        || ''),
                billing_postal_code:billingSame ? '' : (formData.get('billing_postal_code') || ''),
                billing_country:    billingSame ? '' : (formData.get('billing_country')     || ''),
            };

            // Save address to profile if checkbox ticked (only when entering a new address)
            const saveCheck = document.getElementById('save-address-check');
            if (saveCheck?.checked) {
                const token = localStorage.getItem('wwc_access_token');
                if (token) {
                    fetch(`${API_URL}/customer/profile/`, {
                        method: 'PATCH',
                        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            default_shipping_first_name:  checkoutData.shipping_first_name,
                            default_shipping_last_name:   checkoutData.shipping_last_name,
                            default_shipping_address_1:   checkoutData.shipping_address_1,
                            default_shipping_address_2:   checkoutData.shipping_address_2,
                            default_shipping_city:        checkoutData.shipping_city,
                            default_shipping_postal_code: checkoutData.shipping_postal_code,
                            default_shipping_country:     checkoutData.shipping_country,
                        })
                    }).catch(() => {}); // fire-and-forget
                }
            }

            try {
                console.log('Creating order...', checkoutData);

                // Step 1: Create order
                const orderResponse = await fetch(`${API_URL}/checkout/`, {
                    method: 'POST',
                    headers: apiHeaders(),
                    body: JSON.stringify(checkoutData)
                });

                const responseText = await orderResponse.text();
                console.log('Order response:', responseText);

                let orderData;
                try {
                    orderData = JSON.parse(responseText);
                } catch (e) {
                    console.error('Failed to parse response:', responseText);
                    throw new Error('Erreur serveur. Veuillez réessayer.');
                }

                if (!orderResponse.ok) {
                    throw new Error(orderData.error || orderData.detail || 'Erreur lors de la création de la commande');
                }

                // Handle response based on payment method
                if (checkoutData.payment_method === 'stripe') {
                    // Checkout returns a Stripe URL directly — redirect
                    if (orderData.checkout_url) {
                        showNotification('Redirection vers le paiement...', 'success');
                        window.location.href = orderData.checkout_url;
                    } else {
                        throw new Error('URL de paiement non reçue');
                    }
                } else {
                    // Bank transfer or cash on delivery — order is created, go to success page
                    window.location.href = `/shop/order-success/?order=${orderData.order_number}&method=${checkoutData.payment_method}`;
                }

            } catch (error) {
                console.error('Checkout error:', error);
                showNotification(error.message || 'Erreur lors de la commande', 'error');

                // Reset button
                btnPay.classList.remove('loading');
                btnPay.disabled = false;
            }
        }

        // Show notification
        function showNotification(message, type = 'success') {
            const el = document.getElementById('notification');
            el.textContent = message;
            el.className = `notification ${type} show`;
            setTimeout(() => el.classList.remove('show'), 4000);
        }

        // Check for cancelled payment
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('payment') === 'cancelled') {
                setTimeout(() => {
                    showNotification('Paiement annulé. Vous pouvez réessayer.', 'error');
                }, 500);
                // Clean URL
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        })();

        renderLangSwitcher();
    </script>
</body>
</html>
